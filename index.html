opts": ["الظلام - الحزن", "الإبصار - القلق", "الحوار - الكدر", "الشمس - الفرح"], "a": 0, "ex": ""}, {"id": "vbank4-8", "track": "verbal", "set": "vbank20", "type": "الخطأ السياقي", "q": "حسن الظن من الآداب الحميدة التي بها تكون الألفة والمحبة بين الناس، فمن حَسُن ظنه بالناس كان في نصب وهم لا ينقضي.", "opts": ["الآداب", "حَسُن", "هم", "ينقضي"], "a": 1, "ex": "الصواب: ساء"}, {"id": "vbank40-7", "track": "verbal", "set": "vbank20", "type": "الخطأ السياقي", "q": "اجعل قبرك خزانتك، احشها من كل عمل صالح، فإذا وردت على الناس سرّك ما ترى فيه.", "opts": ["احشها", "الناس", "سرّك", "ترى"], "a": 1, "ex": "الصواب: القبر"}, {"id": "vbank29-10", "track": "verbal", "set": "vbank20", "type": "استيعاب المقروء", "q": "معنى كلمة (تشريط) وفقًا للنص:", "opts": ["تبترها", "تشقها", "تعزلها", "تفسرها"], "a": 1, "ex": "", "passage": "الحجامة\nينصح العلماء ألا تتم الحجامة في بداية الشهر العربي، أو نهايته، وإنّما في منتصف الشهر، حيث أنّه لا يكون هائجًا في بداية الشهر، ويكون ساكنًا في نهايته. وأن تتمّ في فترة الصباح أو الظهر وليس في الليل، وأفضل الأوقات في الساعة الثانية والثالثة بعد الظهر، وأن تكون في الصيف لا في الشتاء، أو تدفئة الغرفة التي ستتم فيها الحجامة جيّدًا.\nالحجامة الجافّة تستخدم كاسات الهواء، وتقوم بتوزيع الدم الفاسد من مواضع الألم، وبالتّالي تخفّف الآلام، والحجامة الرطبة تشبه إلى حدّ كبير الحجامة الجافّة، حيث يتمّ استخدام الكؤوس المفرغة من الهواء أيضًا، ولكن يتمّ عمل تشريط، أي جروح خفيفة في الجلد، وذلك من أجل السماح للدم الفاسد من الخروج."}, {"id": "vbank10-9", "track": "verbal", "set": "vbank20", "type": "استيعاب المقروء", "q": "تنمية العادة الإرادية تكون بـ:", "opts": ["عدة عوامل شخصية", "يعتمد على ثقافة الفرد", "حسب مستوى الشخص التعليمي والاجتماعي", "جملة عوامل شخصية وخارجية"], "a": 3, "ex": "", "passage": "الإحساس الوجداني\n١- ميز بعض علماء النفس بين الحياة الوجدانية والحياة الانفعالية، أما الوجدانية فهي مجموع الحالات الانفعالية كالرغبة والألم والفرح والحزن، وأما الفاعلية فتأتي في صورتين هما الآلية والفعل الإرادي، والأولى هي كل فعل يتصف بالتلقائية، على حين أن كل فعل واعٍ أي مدرك بالعقل يسمى الفعل الإرادي.\n٢- يقوم الوجدان أحيانًا بوظيفة المنشط والمساعد على تحقيق الفعل الإرادي؛ وذلك حينما نميل إلى ما هو مستحب عندنا أو مقبول، فنعمل على تحقيقه ونهرب من العكس. ومن ثم تدخل الأحاسيس في طيات الفعل الإرادي إلى جانب الإدراك والوعي. ويعمل المزاج الانفعالي الجيد وقوة الإحساس على سرعة الاستجابة الإرادية ودقتها، وإذا كانت هذه القوة النفسية في حالة غير جيدة فإننا سنفقد الفعل الإرادي حتمًا. وينبغي أن نشير إلى أن كلمة الوجدان لا تستخدم إلا في سياق الحديث عن الحياة النفسية الراقية.\n٣- ويرى بعض العلماء أن الإرادة تقترن بالجهد، وهنا يمكن أن نسأل عن حال الفعل الصادر عن العادة وبخاصة الفعل الذي ينفذ من غير جهد ومن غير انتباه، أهو فعل إرادي أم غير إرادي؟\nيمكن في واقع الأمر أن نميز بين نوعين من العادة: أحدهما العادة التي تتسم بالسلبية ومناقضة الإرادة وتتصف بالخمول والضعف ويذعن لها بعض الناس، وهي ليست بغريبة عن الإرادة التي كثيرًا ما تعمل على مواجهتها؛ لإيقاف ممارستها أو لإضعافها.\n٤- والنوع الآخر عادة غير إرادية ولكنها مفيدة ترقى بسلوك الإنسان وتجعله أكثر إنتاجية، بمعنى أن يقوم بجهد منظم يؤدي إلى الإنجاز في وقت قصير، وذلك كالنجار وعامل البناء والكاتب، وإذا حللنا أساس هذا النوع من العادة وجدناه فعلًا إراديًا حصل تعلمه بعد جهد ثم أصبح مع الزمن فعلًا آليًا أطلقنا عليه اسم العادة فحسب. والأحرى بنا أن نضيف الإرادة إلى اسم هذا النوع لتكن صفة له.\n٥- والبنية النفسية للفعل الإرادي شديدة التعقيد، وقد بسطها قدماء النفسيين بقولهم: إنها تتركب من تصور الهدف، وهو ما سمي حضور الفعل قبل تنفيذه، يليها الحوار الذاتي سعيًا إلى وزن الأمور للتمييز بين (الضد) و(غير الضد)، وتدخل هنا البواعث والعلل، أي: العوامل الثقافية والاجتماعية وطبيعة ذهن الفرد إلى جانب العوامل الوجدانية، أما المرحلة التالية فتتمثل في القرار الذي يعقبه التنفيذ العملي، أي: ترجمة القرار إلى فعل.\n٦- وعن تربية الإرادة نقول بإيجاز: تتضافر مجموعة عوامل لتربية الإرادة، منها ما يتعلق بالصحة العامة للإنسان، ومنها عناصر النظام التربوي التي تقوي الثقة بالنفس وتزرع نزعة المبادرة والتفكير على نحو منطقي، والقدرة على تحديد الهدف مع الرؤية الشمولية لمعطيات الحالة، ومنها المحيط الاجتماعي السليم الذي يسعى لتنمية المشاعر السامية والحفاظ على الحماسة لمواجهة التردد والشك وتنمية الاستعداد الوجداني والذهني للعمل بروح فريق.\n٧- وكلما ازدادت العادات الإرادية عند الإنسان في مجال ما ازدادت قدرته على سرعة تحقيق إرادات أخرى تنتمي إلى نفس المجال، فالذي اعتاد أن يضحي بالعاطفة أمام العقل والواجب بلا تردد؛ فإنه يتغلب تلقائيًا على الصعوبات التي تواجهه بسبب الصراع بينهما، أما علاقة الإرادة بالوراثة فحديث ذو شجون لا يستوعبها المقام."}, {"id": "vbank21-13", "track": "verbal", "set": "vbank20", "type": "استيعاب المقروء", "q": "يغلب على أسلوب الفقرة (١):", "opts": ["التقويم", "التعداد", "التعريف", "التقديم"], "a": 2, "ex": "", "passage": "التنمية والنمو\n(١) يخلط البعض بين مفهومي التنمية والنمو، باعتبارهما مفهومين مترادفين، رغم ما بينهما من تباين في عدد من الأوجه. فالنمو يتضمن عملية تغيير تلقائية تحدث من غير تدخل من جانب الإنسان، أو أن هذا التدخل يكون محدودًا وفي جانب واحد غالبًا. أما التنمية فتشير إلى عملية تغيير متعمدة محكومة بإرادة إنسانية وبجهود منظمة لتحقيق أهداف تمس حياة الإنسان بأكملها.\n(٢) كما أن مقدار التغير الحادث من طريق النمو عادة ما يكون ضئيلًا وأقرب إلى التغيير الكمي. أما التغيير المصاحب للتنمية فهو تغيير عميق وسريع وأقرب إلى التغيير الكيفي. فالنمو يحدث عن طريق التطور البطيء والتحول التدريجي، أما التنمية فتحتاج إلى دفعة قوية تخرج المجتمع من حالة الركود والتخلف إلى حالة التقدم والازدهار.\n(٣) وأخيرًا فإن النمو مستوعب في التنمية، في حين ليس من الضروري أن يفضي كل نمو إلى تنمية. لذا يمكن القول إن الدول النامية ليست في حاجة إلى مجرد النمو، وإنما هي في حاجة إلى التنمية المبنية على القدرة والخصائص الذاتية لكل دولة. ويظهر الفرق بين مفهوم التنمية ومفهوم التقدم من حقيقة أن عملية التنمية ومستواها يمكن التحقق منها عمليًا وموضوعيًا، أما التقدم فهو حكم قيمي وتفسير ذاتي ونسبي؛ يختلف باختلاف الإطار الفلسفي والفكري لكل مجتمع."}, {"id": "vbank26-9", "track": "verbal", "set": "vbank20", "type": "استيعاب المقروء", "q": "كم نسبة غير المصابين بالسمنة في أمريكا؟", "opts": ["٦٦٪", "٧٧٪", "٥٥٪", "٨٨٪"], "a": 0, "ex": "", "passage": "السمنة في الدول المتقدمة\nتُعرَّف السمنة بأنها تلك الحالة الطبية التي تتراكم فيها الدهون الزائدة بالجسم إلى درجةٍ تتسبب معها في وقوع آثارٍ سلبية على الصحة، مؤديةً بذلك إلى انخفاض متوسط عمر الفرد المأمول، ولها علاقة بمشاكل صحية أخرى، وقد تفاقمت تلك المشكلة في عديد من الدول، فالسمنة لدى الشباب متزايدة، ففي الولايات المتحدة ثلث سكانها مصابون بالسمنة أو زيادة الوزن، وفي كندا ٢٥٪ مصابون بالسمنة ويصاب بها نسبة كبيرة من الشباب، وقد تكون أبرز أسباب الإصابة بها هي الجلوس الطويل أمام التلفاز والحاسب، والشباب المصابون بالسمنة سيظل أغلبهم مصاب بها حتى يصلون إلى سن الرجولة. وسبب السمنة هو أن الطاقة المأخوذة من الطعام الذي يأكله الناس لا يتساوى مع الطاقة المستهلكة التي يقومون بها."}, {"id": "vbank9-13", "track": "verbal", "set": "vbank20", "type": "استيعاب المقروء", "q": "يوصف حال الكاتب بـ:", "opts": ["الاضطراب", "الاتزان", "عدواني", "التردد"], "a": 0, "ex": "", "passage": "الاضطراب\nأريد أن ألطم على وجهي أو على وجه شخص ما أو على سطح ما أو ألطم أي شيء، ما أجمل أن أستمع إلى صوت الضوضاء والضجيج، لكن عندما أتذكر الألم الناتج عن ذلك اللطم أتراجع عن تفكيري هذا."}, {"id": "vbank26-1", "track": "verbal", "set": "vbank21", "type": "تناظر لفظي", "q": "طائرة : طيّار", "opts": ["فيلم : مخرج", "كلمة : شاعر", "طريق : مشاة", "كتاب : مؤلف"], "a": 0, "ex": "العلاقة: يقوده"}, {"id": "vbank22-3", "track": "verbal", "set": "vbank21", "type": "تناظر لفظي", "q": "نتيجة : شهادة", "opts": ["شباب : مراهقة", "يحبو : يمشي", "هرم : شيب", "رضاعة : فطام"], "a": 2, "ex": "العلاقة: يظهر في"}, {"id": "vbank27-2", "track": "verbal", "set": "vbank21", "type": "تناظر لفظي", "q": "حاكم : عادل", "opts": ["سارق : عاقل", "عالم : عامل", "معلم : قادر", "قائد : خائف"], "a": 1, "ex": "العلاقة: صفته"}, {"id": "vbank16-4", "track": "verbal", "set": "vbank21", "type": "تناظر لفظي", "q": "المال : الرفاهية", "opts": ["سيف : شجاعة", "الرطوبة : الصدأ", "بئر : مياه", "طاحونة : حبوب"], "a": 1, "ex": "العلاقة: ينتج عنه"}, {"id": "vbank43-5", "track": "verbal", "set": "vbank21", "type": "إكمال الجمل", "q": "الإصرار ....... سلاحا الحازم .......", "opts": ["والاستمرار - العجول", "والتمني - المكافح", "والتكرار - الأريب" ت"], "a": 0, "ex": "", "passage": "الطريقة العلمية في حل المشكلات\nدراسة المشكلات بطريقة علمية؛ سبب للوصول إلى حلول عملية تنهي أو تخفف من هذه المشكلات."}, {"id": "vbank16-9", "track": "verbal", "set": "vbank21", "type": "استيعاب المقروء", "q": "أي مما يلي لا يندرج تحت معنى (مطلع)؟", "opts": ["مستهل", "غرة", "منتهى", "باكورة"], "a": 2, "ex": "", "passage": "الكوارث (تسونامي)\nذكر مقال متخصص مطلع العام الجاري أن الكوارث أدت إلى خسارة كبيرة تقدر بـ (٩٠٠ مليار دولار) وخسائر بشرية تصل إلى ٧٠٠ ألف شخص، كما ذكر أن ٦٠٪ من الكوارث الطبيعية كانت زلازل، وهي من أكثر الكوارث الطبيعية فتكًا بالبشرية، وأن ٩٠٪ من إجمالي الخسائر البشرية كان في قارة آسيا، والأكثر هولًا هو إعصار تسونامي، فقد كان الأكثر فتكًا على المحيط الهندي، حيث أودى بخسائر تقدر بـ ٢٧٠ ألف شخص."}, {"id": "vbank7-11", "track": "verbal", "set": "vbank21", "type": "استيعاب المقروء", "q": "ما الذي يميز النمل الأبيض؟", "opts": ["يعيش في جماعات مختلفة", "يدمر المساكن الخشبية", "يتحمل درجات الحرارة العالية", "من الحشرات الجافة"], "a": 1, "ex": "", "passage": "النمل الأبيض\nالنمل الأبيض يعيش في جماعات، ويتغذى على الخشب، ويتحمّل درجات عالية من الجفاف."}, {"id": "vbank1-3", "track": "verbal", "set": "vbank22", "type": "تناظر لفظي", "q": "قلم : كتابة", "opts": ["تعليم : معلم", "رسام : رسم", "حصاد : حصادة", "تحذير : محذر"], "a": 1, "ex": "العلاقة: يقوم بـ"}, {"id": "vbank20-3", "track": "verbal", "set": "vbank22", "type": "تناظر لفظي", "q": "طفولة : شباب", "opts": ["غداة : ضحى", "بغل : حصان", "الجمعة : الإثنين", "غدو : رواح"], "a": 0, "ex": "العلاقة: تتابع"}, {"id": "vbank27-4", "track": "verbal", "set": "vbank22", "type": "تناظر لفظي", "q": "رائحة : شم", "opts": ["خشونة : لمس", "طعم : لسان", "سمع : أذن"], "a": 0, "ex": "العلاقة: تعرف بواسطة"}, {"id": "vbank31-1", "track": "verbal", "set": "vbank22", "type": "تناظر لفظي", "q": "هجري : ميلادي", "opts": ["محرم : يناير", "شرقي : غربي", "سنة : يوم", "تاريخ : تقويم"], "a": 0, "ex": "العلاقة: فئة، كلهم شهور"}, {"id": "vbank6-6", "track": "verbal", "set": "vbank22", "type": "إكمال الج يحفز تفاعلًا واحدًا معينًا أو مجموعة من التفاعلات، والشيء الملاحظ في الإنزيم أنه بينما يقوم بتسريع التفاعل فإنه لا يشترك فيه، ومن ثم فإن الإنزيم يعاد استخدامه مرة تلو المرة. تعمل الإنزيمات على أكمل وجه عند درجة حرارة الجسم الموجودة فيه، وعلى سبيل المثال، فإن الإنزيمات في جسم الإنسان تعمل على أكمل وجه عند حرارة ٣٧°م، وهي درجة حرارة أجسامنا المعتادة، وإذا تغيرت درجة الحرارة فإن نسبة الإنزيم تتغير ولا تستطيع أن تعمل بشكل تام، كما أن الإنزيم تهلك فعليًا عند ارتفاع درجة حرارة الجسم وتتأثر بدرجة الحرارة المنخفضة حيث تتوقف عن العمل، وعندما تعود الحرارة لطبيعتها تعمل الإنزيمات بشكلها الطبيعي. والإنزيمات مطلوبة بكميات قليلة لأنه يمكن استخدامها مرات عديدة."}, {"id": "vbank21-12", "track": "verbal", "set": "vbank22", "type": "استيعاب المقروء", "q": "معنى (يفضي) الواردة في الفقرة (٣):", "opts": ["يؤدي", "تفرغ", "تستبدل"], "a": 0, "ex": "", "passage": "التنمية والنمو\n(١) يخلط البعض بين مفهومي التنمية والنمو، باعتبارهما مفهومين مترادفين، رغم ما بينهما من تباين في عدد من الأوجه. فالنمو يتضمن عملية تغيير تلقائية تحدث من غير تدخل من جانب الإنسان، أو أن هذا التدخل يكون محدودًا وفي جانب واحد غالبًا. أما التنمية فتشير إلى عملية تغيير متعمدة محكومة بإرادة إنسانية وبجهود منظمة لتحقيق أهداف تمس حياة الإنسان بأكملها.\n(٢) كما أن مقدار التغير الحادث من طريق النمو عادة ما يكون ضئيلًا وأقرب إلى التغيير الكمي. أما التغيير المصاحب للتنمية فهو تغيير عميق وسريع وأقرب إلى التغيير الكيفي. فالنمو يحدث عن طريق التطور البطيء والتحول التدريجي، أما التنمية فتحتاج إلى دفعة قوية تخرج المجتمع من حالة الركود والتخلف إلى حالة التقدم والازدهار.\n(٣) وأخيرًا فإن النمو مستوعب في التنمية، في حين ليس من الضروري أن يفضي كل نمو إلى تنمية. لذا يمكن القول إن الدول النامية ليست في حاجة إلى مجرد النمو، وإنما هي في حاجة إلى التنمية المبنية على القدرة والخصائص الذاتية لكل دولة. ويظهر الفرق بين مفهوم التنمية ومفهوم التقدم من حقيقة أن عملية التنمية ومستواها يمكن التحقق منها عمليًا وموضوعيًا، أما التقدم فهو حكم قيمي وتفسير ذاتي ونسبي؛ يختلف باختلاف الإطار الفلسفي والفكري لكل مجتمع."}, {"id": "vbank26-13", "track": "verbal" ربة، وعدة الدولة المحاربة، ظنًا منها أن غربتهم عن أجناس الدولة وحضارتها ستجعلهم أطوع في يد الخلافة، وأبعد عن أن يكونوا طرفًا في الصراع على السلطة، ولكن مخاطر الصراعات الداخلية، وأخطار استقلال أطرافها عن مركزها جعل الدولة تكثر من هؤلاء الجند المماليك حتى تضخمت مؤسستهم؛ فاستشعروا القوة التي جعلتهم يسيطرون على الدولة ويشكلون جبهة جديدة للصراع."}, {"id": "vbank2-12", "track": "verbal", "set": "vbank25", "type": "استيعاب المقروء", "q": "كل مما يلي أقل احتكاكًا بالسطوح ما عدا:", "opts": ["المعادن", "الجليد", "الزجاج", "الممحاة"], "a": 3, "ex": "", "passage": "الاحتكاك (القلم الرصاص)\nمن ذاكرة المختبر: «كل الأشياء التي نراها ليست ملساء، مثل المعادن، فهي تحتوي على نتوءات تحت المجهر، والاحتكاك بالسطوح الملساء أقل من السطوح الخشنة، فالكتابة بقلم رصاص على الورق تختلف عن الكتابة على الزجاج.»\nنص آخر: «لا يوجد شيء أملس في الحياة حتى المعادن التي يكون مظهرها أملس. الأسطح الملساء لا تكون ملساء غالبًا كما تبدو، فعلى الرغم من كونها ملساء توجد نتوءات، وحتى المعادن وإن كانت ملساء فإن بها نتوءات.»\nنص آخر: «لا يوجد شيء أملس في الحياة، والمجوهرات يكون مظهرها أملس لكن تحت المجهر يكون بها نتوءات، والأسطح الخشبية غالبًا ما تكون خشنة، كل شيء له احتكاك حتى المعادن، والقلم الرصاص مثلًا إذا احتك بسطح خشبي غيرُه إذا احتك في زجاج.»\nنص آخر: «أسطح الأجسام تختلف بعضها عن بعض في احتكاكها، فعند احتكاك الخشب مع مادة يكون أقوى من احتكاكه مع الجليد.»\nالكتابة بالقلم الرصاص على الورق تختلف ولا تكون مثل الكتابة على الزجاج؛ حيث إن الكتابة على الورق تبقى، أما الكتابة على الزجاج فلا تبقى."}, {"id": "vbank11-11", "track": "verbal", "set": "vbank25", "type": "استيعاب المقروء", "q": "علاقة جملة (وإزاء محدودية ....) بجملة (نجد صعوبة ....):", "opts": ["تفسير لمضمونها", "تعليل بما تضمنها", "تحديد ما فيها", "مناقضتها لها"], "a": 1, "ex": "", "passage": "السدود\nيجب على البلدان أن يكون لها موارد مائية وفيرة وأن توفر موارد غذائية ومائية، ويمكن أن توفر موارد مائية من خلال البحار بنسبة ٨٦٪، والمياه الجوفية بنسبة ١٣,٥٪، والنسبة الباقية للسدود الطبيعية.\nوإزاء محدودية الموارد المائية، والخوف في الاستنزاف في الموارد الما  المقروء", "q": "من النص السابق تتوقع أن يكون مقدمة لكتاب:", "opts": ["رواية", "تفسير", "طوائف", "سير"], "a": 3, "ex": "", "passage": "قال كاتب: كتبت الكتاب لعدة أسباب من ضمنها الترجمة لعظماء كل أمة....\nهناك أشخاص يتصفون بالإيمان والصدق، وأشخاصًا يريدون البحث عن أقرانهم، وأشخاصًا يتحلون بالصفات التي يوّدون البحث عنها..... وإني لهذا وضعتها في طوائف وكل طائفة تختص بشيء من هذه الخصائص، ليسهل على القارئين البحث عن أي شخصية يريدون البحث عنها.... كل من الطوائف له الحق في التعبير."}, {"id": "vbank35-12", "track": "verbal", "set": "vbank29", "type": "استيعاب المقروء", "q": "السبب في انفجار الغواصة:", "opts": ["غامضة", "سرية", "لم يعرفه إلا الأمريكان"], "a": 0, "ex": "", "passage": "الغواصة الروسية\nكانت إحدى الغواصات الروسية تتبختر خارج حدود المياه الإقليمية للولايات المتحدة الأمريكية. وفجأة وبدون أسباب معروفة هز انفجار مروع أجزاء الغواصة فهوت إلى أعماق المحيط وفي داخلها أكثر من مئة بحار ومتخصص.\nولم تكن هذه الغواصة من النوع العادي على الإطلاق، بل كانت واحدة من أحدث ما أنتجته تقنية الاتحاد السوفيتي في ذلك الوقت، إضافة إلى أنها كانت تضم عددًا من الصواريخ النووية وأجهزة التصويب المتقدمة. وحدث أن أطلقت الغواصة قبل غرقها إشارة استغاثة ضعيفة لم تستطع البحرية السوفيتية التقاطها، بينما تمكن الأمريكان من ذلك واستطاعوا بفضلها تحديد مكان الغواصة لاحقًا ومرت شهور طويلة والأسطول السوفيتي يبحث في قاع المحيط بدون كلل أو ملل، ولكن لا حياة لمن تنادي!\nأما بالنسبة للولايات المتحدة فقد فضلت التغاضي عن الحادث وقررت انتشال الغواصة للاطلاع على التقنية السوفيتية المتقدمة في هذا المجال. ولم تكشف أمريكا عن هذا السر إلا بعد أن انتهت من تنفيذ أضخم عملية انتشال في التاريخ استمرت لسبع سنوات شارك فيها ٤٠٠٠ شخص، غير العلماء والمتخصصين، وكلفت ما يربو على ٣٥٠ مليون دولار بأسعار ذلك الوقت وأحيطت بسرية شديدة!"}, {"id": "vbank22-13", "track": "verbal", "set": "vbank29", "type": "استيعاب المقروء", "q": "جاءت (تذوقوا) و(شربوا) .......", "opts": ["ترادف", "تتابع", "تضاد", "تشابه"], "a": 0, "ex": "", "passage": "في معركة اليرموك جرح الحارث بن هشام، وعكرمة بن أبي جهل، وعيَّاش بن أبي ربيعة - رضي الله عنهم - وكانو  "track": "verbal", "set": "vbank30", "type": "استيعاب المقروء", "q": "علاقة جملة «أو أن هذا التدخل ..» بالجملة التي قبلها في الفقرة (١):", "opts": ["استدراك", "تعليل", "تحليل", "استباق"], "a": 0, "ex": "", "passage": "التنمية والنمو\n(١) يخلط البعض بين مفهومي التنمية والنمو، باعتبارهما مفهومين مترادفين، رغم ما بينهما من تباين في عدد من الأوجه. فالنمو يتضمن عملية تغيير تلقائية تحدث من غير تدخل من جانب الإنسان، أو أن هذا التدخل يكون محدودًا وفي جانب واحد غالبًا. أما التنمية فتشير إلى عملية تغيير متعمدة محكومة بإرادة إنسانية وبجهود منظمة لتحقيق أهداف تمس حياة الإنسان بأكملها.\n(٢) كما أن مقدار التغير الحادث من طريق النمو عادة ما يكون ضئيلًا وأقرب إلى التغيير الكمي. أما التغيير المصاحب للتنمية فهو تغيير عميق وسريع وأقرب إلى التغيير الكيفي. فالنمو يحدث عن طريق التطور البطيء والتحول التدريجي، أما التنمية فتحتاج إلى دفعة قوية تخرج المجتمع من حالة الركود والتخلف إلى حالة التقدم والازدهار.\n(٣) وأخيرًا فإن النمو مستوعب في التنمية، في حين ليس من الضروري أن يفضي كل نمو إلى تنمية. لذا يمكن القول إن الدول النامية ليست في حاجة إلى مجرد النمو، وإنما هي في حاجة إلى التنمية المبنية على القدرة والخصائص الذاتية لكل دولة. ويظهر الفرق بين مفهوم التنمية ومفهوم التقدم من حقيقة أن عملية التنمية ومستواها يمكن التحقق منها عمليًا وموضوعيًا، أما التقدم فهو حكم قيمي وتفسير ذاتي ونسبي؛ يختلف باختلاف الإطار الفلسفي والفكري لكل مجتمع."}, {"id": "vbank35-9", "track": "verbal", "set": "vbank30", "type": "استيعاب المقروء", "q": "تعتبر المنتديات ضمن البرامج:", "opts": ["التفاعلية", "الحوارية", "تعامليًا", "علميًا"], "a": 0, "ex": "", "passage": "المنتديات\nالمنتديات هي مكان للحوار والتفاعلية وكل شخص يطرح آرائه...\nنص آخر: أصبحت المنتديات الإلكترونية جزءًا أساسيًا في حياة الناس، خصوصًا بعد أن أسست لنفسها وسطًا تفاعليًا لم يكن منتظرًا.\nنص آخر: في المنتديات يقوموا بنشر آرائهم وتحيزاتهم وموضوعاتهم."}, {"id": "vbank41-13", "track": "verbal", "set": "vbank30", "type": "استيعاب المقروء", "q": "تدل الفقرة الخامسة على أن المدينة المنورة:", "opts": ["توازي دمشق في المكانة العلمية", "لم تفقد أهميتها ومكانتها العلمية", "صارت ذات مكانة سياسية ودينية", "عاصمة الدولة الإسلامية"], "a": 1, "ex": "", "passage": "الإمام مالك\n(١) الإمام مالك بن أنس - رحمه الله - أتاه الله تعالى بسطة في العلم والجسم والخلق، وهي صفات نادرة. وقد اختار أن يكون درسه في مسجد رسول الله ﷺ، ثالث المساجد التي تُشدّ إليها الرحال، وأكبر حلقة علمية في ذلك التاريخ. واختار أن يكون موضع جلوسه المكان الذي كان يجلس فيه عمر بن الخطاب رضي الله عنه في قضائه وتدبيره شئون الدولة، وفتاويه للناس. وكان من حُسْن الاختيار أنه سكن في المنزل الذي كان ينزل فيه عبد الله بن مسعود رضي الله عنه؛ فكان العلم يُظِلُّ فكره في المكان، كما كان يُظِلّه في كل أعماله وكل الأزمان.\n(٢) وقد وُلد في أسرة اشتهرت بالرواية ونشأ بين رواة محدّثين؛ ولذلك اتجه، بعد أن حفظ القرآن الكريم وتفصّح بالعربية، إلى طلب علم الرواية والفقه. وبعد أن وعى ما أدركه من علم أهل عصره؛ اتجه عند نضجه إلى الدرس.\nوقد تحدث أهل المدائن والأمصار باسمه، فكانت فتاويه تُنشر وتذاكر في مصر والشام، وبلاد المغرب كلها، والأندلس.\n(٣) إن تلك المكانة ما جاءته عفوًا، بل لها أسباب من نشأته، ومن جهوده، ومن شيوخه، ومن شخصه؛ مما أدى إلى فيض علمه الغزير واستنباطه الفقهي السليم، وإدراك مصالح الناس والعلم بالقرآن والسنة، وتنقيح الرواية ونقدها بدراية عميقة مُدرِكة. وقد عاش في عصر ماجَتْ فيه فتَنٌ كموج البحر، وكان هو يركب سفينة النجاة، ولا يخوض فيها، ويستنقذ الدين والعلم والفقه بشخصه القوي.\n(٤) وقد كانت البيئة العامة كبيئته الخاصة توجهه نحو المعرفة وطلب الرواية. فقد وُلد وعاش بمدينة رسول الله ﷺ، ومنزل الشرع الإسلامي، ومعقل حكم الإسلام الأول إذ كانت قصبة الدولة الإسلامية في عهد أبي بكر وعمر وعثمان وعلي رضي الله عنهم.\n(٥) وكانت للمدينة أيضًا تلك المنزلة العلمية في العهد الأموي؛ إذ كانت مهد السنن والفتاوى المأثورة، حتى لقد كان الحاكم العادل عمر بن عبد العزيز - رحمه الله - يكتب إلى الأمصار يعلمهم السنن والفقه، ويكتب إلى أهل المدينة يسألهم عما مضى، ويعمل بما عندهم.\n(٦) وكان في درسه يبتعد عن الغُلوّ، ولم تكن فيه جفوة ولا خشونة، وقد قال بعض تلاميذه: كان إذا جلس معنا كأنه واحد منا، يتبسّط معنا في الحديث، وهو أشد تطامنًا منا له، فإذا أخذ في حديث رسول الله ﷺ تهيّبنا كلامه، كأننا ما عرفناه ولا عرفنا."}, {"id": "vbank30-13", "track": "verbal", "set": "vbank30", "type": "استيعاب المقروء", "q": "(لا يلتزم السجع كثيرًا، خصوصًا إذا ترجم للرجال) ما المقصود بـ (ترجم)؟", "opts": ["نقل من لغتهم إلى لغتنا", "نقل من لغتنا إلى لغتهم", "كتب في سيرهم", "شرح عنهم"], "a": 2, "ex": "", "passage": "الصفدي\nولد الصفدي صلاح الدين خليل أيبك سنة ٦٩٦ هـ وتوفي سنة ٧٦٤ هـ، وكان أدبه من أفضل أساليب الأدب في دهره، لا يلتزم السجع كثيرًا، خصوصًا إذا ترجم للرجال، وشعره كثير وبعضه جيد وأجود، ويُعد في باب التأليف من المكثرين المجوّدين. كتب بيده كما قال ما يقارب خمسمائة مجلد دخلت في خمسين مصنفًا قال: ولعل الذي كتبته في «ديوان الإنشاء» ضعف ذلك."}, {"id": "vbank23-9", "track": "verbal", "set": "vbank30", "type": "استيعاب المقروء", "q": "العلماء وجدوا أن الشيخوخة مرتبطة بـ:", "opts": ["صعوبة في الحركة", "ظهور هرمون B٢١", "الأمراض المزمنة", "أنها مرتبطة بعمر الستين"], "a": 1, "ex": "", "passage": "الشيخوخة\nإن مفهوم الشيخوخة في عصرنا الحالي اختلف ولم يعد يعتمد على العمر، وقد اكتشف العلماء عددًا من الأمراض المزمنة المرتبطة بالشيخوخة منها الروماتيزم والزهايمر، واكتشف العلماء أن ظهور الجين B٢١ هو المسؤول عن شيخوخة الخلايا، هذا الاكتشاف لم يفد العلماء إلا بمعرفة أن هذا الجين يؤدي إلى انهيار الأعضاء.\n— نص آخر —\nالشيخوخة لم تعد مقتصرة على عمر الستين، مجموعة من العلماء الأمريكان توصلوا إلى الأمراض التي تصيب الإنسان في شيخوخته كالتهاب المفاصل وأمراض الزهايمر والقلب والسكر، وقد توصل الباحثون إلى أن الجين المسؤول عن ظهور أعراض الشيخوخة هو B٢١ حيث إنه هو المسؤول عن تنشيط خلايا الدماغ."}, {"id": "vbank20-2", "track": "verbal", "set": "vbank31", "type": "تناظر لفظي", "q": "طائرة : سيارة", "opts": ["دراجة : صاروخ", "الزهرة : الأرض", "شجاعة : جسارة", "القطار : العربة"], "a": 1, "ex": "العلاقة: فئة"}, {"id": "vbank39-1", "track": "verbal", "set": "vbank31", "type": "تناظر لفظي", "q": "حروف : كلمات", "opts": ["أغصان : أشجار", "نمور : حيوانات", "ذهب : معادن", "قاضي : عدل"], "a": 0, "ex": "العلاقة: جزء من"}, {"id": "vbank33-4", "track": "verbal", "set": "vbank31", "type": "تناظر لفظي", "q": "نهر : ضفة", "opts": [ "], "a": 2, "ex": "", "passage": "الهلال\nمن آداب الإسلام أن الحكيم بصدق من إذا جاءه شخص يسأله عن سؤال لا فائدة من إجابته فرده عنه (صرفناه عنه)، ويجيبه بفائدة تعود على سؤال ويرده إلى الصواب. معاذ بن جبل وثعلبة بن عنمة وهما رجلان من الأنصار، قالا: يا رسول الله ما بال الهلال يبدو ويطلع دقيقًا مثل الخيط، ثم يزيد حتى يعظم ويستوي ويستدير، ثم لا يزال ينقص ويدق حتى يكون كما كان: لا يكون على حال واحدة؟ فرد الحق بنزول هذه الآية ﴿يَسْأَلُونَكَ عَنِ الْأَهِلَّةِ قُلْ هِيَ مَوَاقِيتُ لِلنَّاسِ وَالْحَجِّ﴾. فمعرفة الأهلة ليس في ذلك فائدة كبيرة، فبين أنها تستعمل للمواقيت."}, {"id": "vbank17-9", "track": "verbal", "set": "vbank38", "type": "استيعاب المقروء", "q": "تكمن خطورة لحم الخنزير في أن:", "opts": ["لحم الخنزير يساعد على الإصابة بمرض سرطان هرمونات النمو", "لحم الخنزير يساعد على الإصابة بمرض السرطان", "لحم الخنزير يسبب مرض الترجينا المسرطن", "لحم الخنزير يقلل من الإصابة بالبنزوبايرين"], "a": 1, "ex": "", "passage": "من نعم الله علينا أن حرم علينا أكل لحم الخنزير؛ لأن أكله ينتج عنه أمراض ضعف المناعة أو ضعف المقاومة مثل مرض الترجينا ومرض تشمع الكبد ومرض التصلب المتعدد ومرض التهاب الكبد. لحم الخنزير يحتوي على نسب عالية من هرمونات النمو والكوليسترول ومادة البنزوبايرين وهي مادة مسرطنة."}, {"id": "vbank36-12", "track": "verbal", "set": "vbank38", "type": "استيعاب المقروء", "q": "يمكن استبدال كلمة (يعاني) بكلمة أخرى مع بقاء المعنى وهي:", "opts": ["يرجو", "يقدر", "يتسع", "يشكو"], "a": 3, "ex": "", "passage": "سلم النجاح لا يعاني من الازدحام في أعلاه."}, {"id": "vbank23-1", "track": "verbal", "set": "vbank39", "type": "تناظر لفظي", "q": "الكف : المنع", "opts": ["السابق : اللاحق", "النور : الضياء", "القبض : البسط", "الشتاء : الخريف"], "a": 1, "ex": "العلاقة: ترادف"}, {"id": "vbank7-3", "track": "verbal", "set": "vbank39", "type": "تناظر لفظي", "q": "احتلال : اختلال", "opts": ["تجربة : حنكة", "قيادة : إدارة", "قطع : سرقة", "نعيم : رخاء"], "a": 0, "ex": "العلاقة: ينتج عنه"}, {"id": "vbank15-2", "track": "verbal", "set": "vbank39", "type": "تناظر لفظي", "q": "ريح : عاصف", "opts": ["حرب : سؤول عن تنشيط خلايا الدماغ."}, {"id": "vbank2-10", "track": "verbal", "set": "vbank39", "type": "استيعاب المقروء", "q": "يفهم من النص أن مادة الكاروتين تساعد على القضاء على:", "opts": ["الكوليسترول", "الدهون", "الزيوت", "السرطان"], "a": 3, "ex": "", "passage": "الزعفران\nالزعفران يستخدم في الطب التقليدي كمنشط وطارد ومانع للأرياح. وفي اليابان يوضع الزعفران في كبسولات وتستخدم في المساعدة على النوم في حالات الأرق. وفي الأبحاث العلمية الحديثة يستعمل الزعفران للحماية من السرطان، وفي حالات فقدان الذاكرة، وفي أمراض القلب. والزعفران يحوي مادة برتقالية غامقة اللون تذوب في الماء هي الكاروتين، ولها تأثير مضاد للأكسدة ومضاد للأورام، والكاروتين جيد للمحافظة على منع أمراض القلب وزيادة المناعة.\nودلت الأبحاث العلمية في المكسيك أن الزعفران يساعد خلايا المناعة على القضاء على الخلايا السرطانية."}, {"id": "vbank27-11", "track": "verbal", "set": "vbank39", "type": "استيعاب المقروء", "q": "إذا قمنا بضخ الماء إلى داخل البئر ماذا سيحدث له؟", "opts": ["يصعد", "يهبط", "يتبخر", "يتمازج"], "a": 1, "ex": "", "passage": "بئر النفط\nفي بعض الحالات، يقوم المهندسون بحقن كميات كبيرة من الماء إلى المكمن النفطي عبر آبار الحقن، بحيث يدفع هذا الماء النفط نحو آبار الإنتاج، ليخرج النفط من فوهة البئر بكفاءة أعلى."}, {"id": "vbank5-11", "track": "verbal", "set": "vbank39", "type": "استيعاب المقروء", "q": "فيما يتعلق بأنف الإنسان، كلمة «يكفي» في النص تعني:", "opts": ["الدلالة على أهميته", "الوصف طريقة عمله", "الكشف دقة وظائفه", "الإثبات حاجتنا له"], "a": 0, "ex": "", "passage": "الحواس\nهل تعلم أن بدنك أعضاء وأجهزة شتى قد تآلفت أشد التآلف، هل تساءلت يومًا أي هذه الأعضاء هو الأجل؟ أهو دماغك الذي به تتعلم والمؤلف من ملايين الخلايا في صفوف مرتبة، منها المحرك ومنها صاحب الحس، ومنها المدرك، ومنها المنطق والسامع، أم هي عينك التي بها تقرأ وتحدّق في القاصي والداني، في سرعة كلمح البصر، خلق الله لها جفنيها يقيانها من الغبار وطول النظر، أم أذنك التي لا ترى منها سوى صيوانها جامع الأصوات، وما خفي منها أعظم شأنًا وأدق تركيبًا، ومهمتها التقاط الموجات الصوتية وتحويلها إلى إشارات كهربية عصبية يفهمها دماغك. أما أنفك، فما خبره؟ يكفي أنك عبره تستنشق الهواء وتزفره ألف مرة كل ساعة فيدفئه ويرطبه وينظفه، وهو الذي يميز لك الطيب من الخبيث من نبات وطعام ورائحة."}, {"id": "vbank36-9", "track": "verbal", "set": "vbank39", "type": "استيعاب المقروء", "q": "من خلال النص فإن الكرم صنف من:", "opts": ["التربية", "الأدب", "الحسب", "الطبيعة"], "a": 1, "ex": "", "passage": "الأدب هو عبارة عن معرفة ما يُحترز به من جميع أنواع الخلل. وهو قسمان: طبيعي وكسبي. فالطبيعي ما فطر عليه الإنسان من الأخلاق الحسنة والصفات المحمودة كالكرم والحلم. والكسبي ما اكتسبه بالدرس والحفظ والنظر، فحينئذ يعرف بأنه علم صناعي تعرف به أساليب الكلام البليغ في كل حال من الأحوال وهو المدعو (بعلم الأدب)، وموضوع الكلام المنظوم والمنثور من حيث فصاحته وبلاغته."}, {"id": "vbank27-3", "track": "verbal", "set": "vbank40", "type": "تناظر لفظي", "q": "ركوب : ترجل", "opts": ["مغادرة : رحيل", "إقامة : ظعن", "صلاة : قصر", "سفر : غربة"], "a": 1, "ex": "العلاقة: تضاد"}, {"id": "vbank36-2", "track": "verbal", "set": "vbank40", "type": "تناظر لفظي", "q": "قاضي : عدل", "opts": ["قائد : حرب", "غني : كرم", "معلّم : معرفة", "بخيل : إملاق"], "a": 2, "ex": "العلاقة: ينشر"}, {"id": "vbank14-4", "track": "verbal", "set": "vbank40", "type": "تناظر لفظي", "q": "البر : صلة الرحم", "opts": ["قتال : مبارزة", "إصلاح : إحسان", "اجتهاد : علم", "سحاب : نجوم"], "a": 0, "ex": "العلاقة: من أنواعه"}, {"id": "vbank15-4", "track": "verbal", "set": "vbank40", "type": "تناظر لفظي", "q": "سد : طاقة", "opts": ["الجفاف : الصحراء", "رتيب : ملل", "قلم : إجادة", "الرزق : بكور"], "a": 1, "ex": "العلاقة: ينتج عنه"}, {"id": "vbank3-5", "track": "verbal", "set": "vbank40", "type": "إكمال الجمل", "q": "الابتسامة تفعل فعلها في ....... المجتمع، وتلاطف أهله و.......", "opts": ["بناء - تضاحكهم", "ارتقاء - تجاورهم", "نقاء - تعاضدهم", "إزراء - تآزرهم"], "a": 2, "ex": ""}, {"id": "vbank9-8", "track": "verbal", "set": "vbank40", "type": "إكمال الجمل", "q": "ليس الأصدقاء من يعبرون عن حبهم في الأوقات ....... بل من يعبرون عن حبهم في الأوقات .......", "opts": ["السعيدة - العصيبة", "السيئة - الجميلة"], "a": 0, "ex": ""}, {"id": "vbank31-7", "track": "verbal", "set": "vbank40", "type": "الخطأ السياقي", "q": "هم المؤمن إقامة الصلاة حتى على أقرب الناس إليه.", "opts": ["هم", "المؤمن", "الصلاة", "أقرب"], "a": 2, "ex": "الصواب: العدل"}, {"id": "vbank15-7", "track": "verbal", "set": "vbank40", "type": "الخطأ السياقي", "q": "إذا كنت حريصًا على حياتك، فلا تبدد مالك فإنه مادة الحياة.", "opts": ["حياتك", "تبدد", "مالك", "مادة"], "a": 2, "ex": "الصواب: وقتك"}, {"id": "vbank26-11", "track": "verbal", "set": "vbank40", "type": "استيعاب المقروء", "q": "العلاقة بين (السمنة) و(زيادة الوزن):", "opts": ["ترادف", "تتابعية", "من العموم إلى الخصوص", "إطنابية"], "a": 0, "ex": "", "passage": "السمنة في الدول المتقدمة\nتُعرَّف السمنة بأنها تلك الحالة الطبية التي تتراكم فيها الدهون الزائدة بالجسم إلى درجةٍ تتسبب معها في وقوع آثارٍ سلبية على الصحة، مؤديةً بذلك إلى انخفاض متوسط عمر الفرد المأمول، ولها علاقة بمشاكل صحية أخرى، وقد تفاقمت تلك المشكلة في عديد من الدول، فالسمنة لدى الشباب متزايدة، ففي الولايات المتحدة ثلث سكانها مصابون بالسمنة أو زيادة الوزن، وفي كندا ٢٥٪ مصابون بالسمنة ويصاب بها نسبة كبيرة من الشباب، وقد تكون أبرز أسباب الإصابة بها هي الجلوس الطويل أمام التلفاز والحاسب، والشباب المصابون بالسمنة سيظل أغلبهم مصاب بها حتى يصلون إلى سن الرجولة. وسبب السمنة هو أن الطاقة المأخوذة من الطعام الذي يأكله الناس لا يتساوى مع الطاقة المستهلكة التي يقومون بها."}, {"id": "vbank40-12", "track": "verbal", "set": "vbank40", "type": "استيعاب المقروء", "q": "المعنى الأقرب للنص:", "opts": ["لكي تسعد عليك أن تتقن فن التجاهل", "قلب لا يبالي لا يعيش سعيدًا", "من لا يرضى بالقليل لا يرضى أبدًا", "إذا أسعدت نفسك أسعدت من حولك"], "a": 2, "ex": "", "passage": "القناعة\nإذا أردت السعادة فلا تنظر لمن قسم له أكثر منك، بل انظر لمن قسم له أقل منك."}, {"id": "vbank25-12", "track": "verbal", "set": "vbank40", "type": "استيعاب المقروء", "q": "الفكرة التي يدور حولها النص:", "opts": ["مرض الأمعاء وعلاجه", "مرض الأمعاء وآثاره", "الرضاعة الطبيعية هي الحل", "الرضاعة الصناعية ومضارها"], "a": 3, "ex": "", "passage": "الرضاعة\nمرض الأمعاء يصيب الأطفال الذين يتناولون الحليب الصناعي ٣ أضعاف الأطفال الذين يتناولون حليب الأم."}, {"id": "vbank7-12", "track": "verbal", "set": "vbank40", "type": "استيعاب المقروء", "q": "ماذا تمثل جملة (قلة وعي الناس بالبرامج الأمنية) لجملة (زيادة معدلات الاختراق)؟", "opts": ["تعليلية", "توافقية", "ترادفية"], "a": 0, "ex": "", "passage": "مع انتشار الأجهزة وقلة وعي الناس بالبرامج الأمنية، زادت معدلات الاختراق في العالم."}, {"id": "vbank20-12", "track": "verbal", "set": "vbank40", "type": "استيعاب المقروء", "q": "امتداد طبقة الأوزون عن سطح اليابسة يتراوح من ....... إلى .......", "opts": ["٢٠ كم إلى ٣٥ كم", "من ١٢ إلى ٣٥", "١٢ كم", "٢٠ كم"], "a": 1, "ex": "", "passage": "الغلاف الجوي\nيُعرف الغلاف الجوي بأنّه الطبقة التي تتكوّن من خليط من الغازات المحيطة بالكواكب أو بالأجسام التي كتلتها عالية مثل النجوم، بحيث تبقى ملاصقة لهذا الجسم من خلال قوّة الجاذبية الأرضيّة، ومن الأهمية الكبيرة للغلاف الجوي أنّه يقوم بتزويد الكائنات الحيّة بالغازات التي يحتاجها في عمليّة التنفّس. يعد الغلاف الجوي غلافًا شفافًا يسمح بمرور الأشعة المرئيّة والحراريّة من خلاله، بالإضافة إلى أنّه يقي الأرض ويحميها من الإشعاعات الضارّة الصادرة من الشمس مثل الأشعة فوق البنفسجية والتي تمتصها طبقة الأوزون، وأيضًا بحماية الأرض من النيازك والشهب التي تصدر من الفضاء الخارجي. ويعتبر غاز الأوزون من نعم الله علينا فهو يحمي الأرض من الأشعة الضارة للشمس ويتواجد على ارتفاع من ٢٠ إلى ٣٥ كم من سطح اليابسة بتركيز عالٍ. ويتكون غاز الأوزون نتيجة تعرض غاز الأكسجين في الغلاف الجوي للأشعة فوق البنفسجية الضارة التي تفككه وتجعله يتحد مع ذرتين أكسجين أخرتين مكونًا ثلاثي الأكسجين المعروف باسم الأوزون في طبقة الستراتوسفير، وتبدأ من ١٢ كم عن سطح الأرض وهي تحتوي على غاز الأوزون."}, {"id": "vbank16-3", "track": "verbal", "set": "vbank41", "type": "تناظر لفظي", "q": "طفولة : شباب", "opts": ["غداة : ضحى", "بغل : حصان", "الجمعة : الإثنين", "غدو : رواح"], "a": 0, "ex": "العلاقة: تتابع"}, {"id": "vbank34-3", "track": "verbal", "set": "vbank41", "type": "تناظر لفظي", "q": "ضحى : نهار", "opts": ["جناح : طير", "سواد : ليل", "ده جود للكائنات الحية على الأرض، فنحن نستنشقه يوميًا مع الهواء، الذي يؤلف الأكسجين خمسه، كما أنه موجود في العديد من الأشياء، ففي البحار يتواجد الأكسجين مذابًا في الماء، كما يشكل جزءًا رئيسيًا من تركيبه، وفي الصخر يؤلف الأكسجين جزءًا رئيسيًا من معظم معادنه. يتألف الأكسجين العادي من جزيئات ثنائية الذرات، أما معظم الأكسجين في أعالي الجو فشكل آخر منه، إذ يتألف جزيئه من ثلاث ذرات ويعرف بالأوزون، وهو طبقة واقية حول الأرض تحجب الأشعة الفضائية المؤذية."}, {"id": "vbank32-12", "track": "verbal", "set": "vbank44", "type": "استيعاب المقروء", "q": "استخدامه لكلمة (رغبات) وكلمة (مشاعر) يدل على أنه سيستخدم في إعلانه طرق:", "opts": ["غير منطقية", "غير مفهومة", "المبالغة", "المنطقية"], "a": 2, "ex": "", "passage": "قياس الرأي العام\nقياس الرأي العام هو عملية يتم بواسطتها التعرف على اتجاهات الناس ومواقفهم إزاء بعض القضايا، بغية معرفة أبعادها وحجمها وما لديهم من معلومات وأراء تجاهها. ومن أغراض قياسات الرأي العام الأساسية دراسة السوق، فقد تنبّهت الشركات والمؤسسات منذ أمد بعيد إلى أهمية التعرف على رغبات الجمهور، ولذا كانت دراسة السوق أسلوبًا عمليًا للتعرف على حجم الاستهلاك والعادات الاستهلاكية والأشياء المفضلة عند المستهلكين، وآرائهم ومشاعرهم في القضايا الاستهلاكية لتصميم الإعلان التجاري في ضوئها. وقد كان من أهم ما يميز نتائج هذه الاستطلاعات سريّتها، فلا يظهر منها إلا نتيجة تجارية يطلع الجمهور عليها في وسائل الإعلام المختلفة."}, {"id": "vbank3-11", "track": "verbal", "set": "vbank44", "type": "استيعاب المقروء", "q": "يحث النص على:", "opts": ["التركيز", "الاحتقار", "التذاكي", "التجاهل"], "a": 3, "ex": "", "passage": "أنا أمثل دور الأعمى عندما أرى زلة شخص لا أود خسارته."}, {"id": "vbank9-9", "track": "verbal", "set": "vbank44", "type": "استيعاب المقروء", "q": "ما معنى (سنائه)؟", "opts": ["نوره", "جماله", "استدارته", "حجمه"], "a": 0, "ex": "", "passage": "القمر وسناؤه\nسكان المدن لا يرون جمال السماء إلا بعد سقوط المطر، فالأجواء في المدينة تحرمك من رؤية شروق الشمس وغروبها ولا رؤية القمر عند اكتماله وجمال ضياء القمر وسنائه."}, {"id": "vbank8-2", "track": "verbal", "set": "vbank45", "type": "تن ا وهولندا أيضًا، وفي عام (١٩٧٨م) قاموا بعمل إحصائية توضح عدد السكان.\nولكي نعادل بين أعداد الأموات والأحياء يجب على العائلة أن يكون لديها طفلين."}, {"id": "vbank45-9", "track": "verbal", "set": "vbank45", "type": "استيعاب المقروء", "q": "الكيمياء العضوية تهتم بدراسة جميع ما يلي ما عدا:", "opts": ["المواد الأرضية", "المواد الصخرية", "المواد المحترقة", "المواد التي لا تحترق"], "a": 3, "ex": "", "passage": "المركبات العضوية (المواد العضوية)\nالكيمياء العضوية تدرس المواد التي تحتوي على الكربون، ولكن ليس كل ما يحتوي على الكربون يُعد مادة عضوية، فبعض المركبات المعدنية (الصخرية الأرضية) تحتوي على الكربون مثل الكربونات، ومع ذلك لا تُعد عضوية، بينما تتميز المواد العضوية بأنها قابلة للاحتراق."}, {"id": "vbank1-10", "track": "verbal", "set": "vbank45", "type": "استيعاب المقروء", "q": "يفهم من الفقرتين (١) و (٢) أن عدد ضحايا الزلزال يرتبط:", "opts": ["بقوة الزلزال", "بتاريخ وقوعه", "بنوع المكان", "بتعدد حدوثه"], "a": 2, "ex": "", "passage": "الزلازل\n(١) منذ بدء تسجيل الزلازل علميًا فإن أعتى الزلازل كانت على النحو التالي بمقياس ريختر: زلزال تشيلي عام (١٩٦٠) فقد سجل ٩,٥، وقتل ألفي شخص، وشرد ثلاثة آلاف آخرين، كما انتقلت هزاته إلى جزر هاواي، وقتلت ٦١ شخصًا، وإلى اليابان حيث قضت على ١٣٨ شخصًا، وزلزال ألاسكا عام ١٩٦٤ الذي وصلت قوته إلى ٩,٢ درجات، ويعد أعنف زلزال شهده النصف الشمالي من الأرض، وتسبب بوفاة ١٢٥ شخصًا.\n(٢) وزلزال جزر أندريانوف عام ١٩٥٧م في ألاسكا أيضًا وبلغت قوته ٩,١ درجات، وقد دمر جزيرة أدك بصورة كاملة، كما تسبب في تدمير حوض السفن في جزيرة إنماك المجاورة، وخطوط النفط الضخمة في منطقة ساندباي. وزلزال كمتشكة عام ١٩٥٢م الذي بلغت قوته تسع درجات وضرب منطقة كمتشكة على الحدود بين اليابان وروسيا وإن لم يسفر عن خسائر في الأرواح، واقتصرت أضراره على الماديات فقط، والزلزال الذي وقع قبالة سواحل سومطرة في نهاية ديسمبر عام ٢٠٠٤م وبلغت قوته ٨,٩ درجات، وقضى على أكثر من ٢٠٠ ألف شخص، إضافة إلى الخسائر المادية الجسيمة."}, {"id": "vbank30-9", "track": "verbal", "set": "vbank45", "type": "استيعاب المقروء", "q": "تخبرنا الفقرة (٢) أن التاريخ القمري بدأ في:", "opts": ["بداية القرن الرابع الميلادي", "نهاية القرن الرابع الميلادي", "بداية القرن الخامس الميلادي", "نهاية القرن الخامس الميلادي"], "a": 2, "ex": "", "passage": "التقاويم\n(١) عرف الإنسان بأن هناك علاقة ما بين الأرض والسماء، وتتأثر الأرض بتغيرات ما تحصل في السماء، ولاحظ الإنسان أن عندما تشرق الشمس تستيقظ الحياة في الأرض وتغني الطيور بشروقها وتهدي الحرارة للأرض، ومن هنا اتخذ الإنسان اليوم كأبسط وحدة زمنية بشروق وغروب الشمس، واستمر التأمل البشري في السماء ليخترع وحدات زمنية أخرى، ولاحظ بأن الاختلاف في مواقع النجوم تخبره عن المواسم البرد والحر والعواصف وغيرها، من هنا عرفت السنة والتقاويم، والتقويم خاص بالشعوب لكل أمة على وجه الأرض تقويمها الخاص الذي تعتز به والذي يعتبر جزءًا أصيلًا من هويتها وثقافتها وشخصيتها ودينها أيضًا، فالمعتقدات الدينية للأمم الموجودة اليوم على سطح الأرض أسهمت بشكل كبير في نشأة التقاويم المعمول بها من قبل هذه الأمم، حيث ترمز بداية التقاويم إلى أحداث دينية عظيمة أثرت ولا تزال تؤثر في حياة الشعوب. والأمة المسلمة كباقي الأمم، لها تقويمها الخاص الذي يعود بها إلى ذكرى مهمّة، قلبت وجه الأرض، والإنسانية إلى آخر الدهر، والقصة أن التقويم الهجري الإسلامي يرمز إلى الهجرة النبوية الشريفة من مكة المكرمة إلى المدينة المنورة؛ حيث أسّس رسول الله ﷺ ومن كان معه من المسلمين الصابرين نواة الدولة الإسلامية التي ما لبثت أن صارت قوّةً عالميّةً عظمى تقف ندًا لند، بل وتتفوق على أقوى قوتين عالميتين في ذلك الوقت وهما: الفرس، والروم. التفت الخليفة عمر بن الخطاب رضي الله عنه إلى مكانة الهجرة النبوية، ودورها العظيم في إعادة صياغة مجرى التاريخ، مما دفعه إلى اتخاذ هذه المناسبة بدايةً للتقويم الهجري الذي لا يزال مستعملًا بين أبناء الأمة الإسلامية إلى يومنا هذا.\n(٢) والفرق بين السنة الهجرية والميلادية ١١ يومًا، والتقويم الميلادي أقدم من التقويم الهجري، فالتقويم الهجري ظهر بعده بأربعمائة واثني عشر عامًا، حيث في سنة ٤١٢ ميلادية وقبل البعثة النبوية بـ ١٥٠ سنة وبمكة المكرمة اجتمع العرب سواء من رؤساء القبائل أو الوفود في حج ذلك العام أيام كلاب بن مرة الجد الخامس للرسول، لتحديد أسماء جديدة للأشهر يتفق عليها كل العرب وأهل الجزيرة العربية بعد أن كانت القبائل تسمي الأشهر بأسماء مختلفة فتوحدوا على الأسماء الحالية.\nمن ذاكرة المختبر: (المصريين كان عندهم تقويم تبع الشمس والنيل.. والروم لديهم تقويم (الروماني)، والتقويم الميلادي، واليوناني، والهجري وكانوا يعتمدوا شهورًا غير محرم وصفر فكان هذا التقويم بالأحداث (مثلًا حدث هذا الشيء بعد عام الفيل بكم عام وهكذا). ثم التقويم الذي وضعه سيدنا عمر بن الخطاب رضي الله عنه.)"}, {"id": "vbank33-12", "track": "verbal", "set": "vbank45", "type": "استيعاب المقروء", "q": "معنى (شواهد) الوارد بالنص:", "opts": ["دراسات نفطية", "أدلة حسية", "أدلة معنوية", "دراسات بحثية"], "a": 1, "ex": "", "passage": "التنقيب على النفط\nعملية البحث والتنقيب عن النفط ليست بالأمر السهل أو اليسير، ذلك أنها تتطلب جهدًا كبيرًا واستثمارات مادية ضخمة، وتتمثل صعوبة التنقيب عن النفط في أن البحث عنه يتم بطرق غير مباشرة تشمل البحث عن تراكيب جيولوجية معينة مناسبة لتجمعه أو شواهد تشير إلى تواجده في القطاع الطبقي ثم البحث عن صخور ذات مسامية ونفاذية جيدة يتحرك خلالها النفط المتكون ثم اختبار هذه الشواهد بالحفر لمعرفة تواجد النفط من عدمه."}, {"id": "vbank1-1", "track": "verbal", "set": "vbank46", "type": "تناظر لفظي", "q": "ثوب : جسم", "opts": ["قبعة : رأس", "قدم : حذاء", "قماش : خياط", "خشب : طاولة"], "a": 0, "ex": "العلاقة: يغطي"}, {"id": "vbank35-1", "track": "verbal", "set": "vbank46", "type": "تناظر لفظي", "q": "حذاء : قدم", "opts": ["سماعة : أذن", "قبعة : رأس", "نظارة : عين", "غطاء : إناء"], "a": 1, "ex": "العلاقة: يوضع في"}, {"id": "vbank29-3", "track": "verbal", "set": "vbank46", "type": "تناظر لفظي", "q": "المسجد : المحراب", "opts": ["طائر : منقار", "ستارة : نافذة", "مكتب : تلفاز", "سيارة : طريق"], "a": 0, "ex": "العلاقة: جزء منه"}, {"id": "vbank40-1", "track": "verbal", "set": "vbank46", "type": "تناظر لفظي", "q": "ازدحام : طريق", "opts": ["تكسر : زجاج", "انفجار : مولد", "اكتظاظ : سوق", "كيس : امتلاء"], "a": 2, "ex": "العلاقة: يحدث لـ"}, {"id": "vbank31-6", "track": "verbal", "set": "vbank46", "type": "إكمال الجمل", "q": "ينبغي للعاقل أن يكون لنفسه .......؛ كي يدعوها للتواضع والعمل.", "opts": ["مهتمًا", "متوّهًا", "متهمًا", "متوهمًا"], "a": 2, "ex": ""}, {"id": "vbank47-5", "tra  بغرفة قيادة الطائرة يستخدمه الطيارون الجدد ويحاكي كل ما يحدث أثناء الطيران، وبدلًا من نافذتها الأساسية توجد شاشة عرض متصلة بجهاز حاسوب يتضمن بيانات عن محركات الطائرة وحركتها في الجو، ومسارات الرحلات الجوية، وطبيعة الأجواء والأراضي التي تمر بها، وكذلك الإقلاع والهبوط، وغيرها.\nويتولى الحاسوب الاستجابة لحركات الطائرة (المحاكي) في مختلف أوضاع الطيران: الإقلاع والتحليق والهبوط، وكل ما قد تواجهه الطائرة من ظروف جوية وأرضية ومشكلات ميكانيكية، وغيرها. أما الطيران الحربي فيتضمن أيضًا الهجوم والمناورة وإطلاق الصواريخ والقنابل."}, {"id": "vbank7-13", "track": "verbal", "set": "vbank46", "type": "استيعاب المقروء", "q": "ذكر في الفقرة حالات سلبية يتخلص منها الطفل إذا تم احتضانه من قبل الآباء، عددها:", "opts": ["١", "٢", "٣", "٤"], "a": 1, "ex": "", "passage": "إن احتضان الآباء للأبناء يزيد من ذكائهم ويخلصهم من القلق وحالات العصبية ويساهم في زيادة ثقتهم بأنفسهم."}, {"id": "vbank31-11", "track": "verbal", "set": "vbank46", "type": "استيعاب المقروء", "q": "إجمالي الإنتاج العالمي من البطاطس سنويًا هو:", "opts": ["٣٥٠ مليون طن", "٣٥٠٠ مليون طن", "١٤٠ مليون طن", "١٤٠٠ مليون طن"], "a": 0, "ex": "", "passage": "البطاطس\nالبطاطس من أشهر الخضروات في أوروبا وأمريكا، وهي تزرع في جميع أنحاء العالم إلا أنها لم تنتقل إلى أوروبا إلا في القرن السادس عشر ...... المناخ. البطاطس أنقذت العالم لأنها رخيصة السعر، وهي مفيدة وغنية بمصادر مفيدة مثل المعادن ومواد أخرى، يتكوّن الجزء الأكبر من البطاطس من الماء، حيث يُشكّل نحو ٨٠٪ من وزنها، تمثل المواد الصلبة حوالي ٢٠٪ من تركيبها الكلي، ويُعد النشا المكوّن الرئيس فيها، ويشكّل النشا نحو ٨٠٪ من هذه المواد الصلبة، مما يعكس أهميته في القيمة الغذائية للبطاطس، لذا تُعتبر البطاطس بذلك مصدرًا غنيًا بالطاقة والنشويات، وتعكس هذه الخصائص دور البطاطس الأساسي في الأنظمة الغذائية المتوازنة. في عام ٢٠٠٧ كانت الصين تمتلك ٧٠ مليون طن من البطاطس وهي تمثل ٢٠٪ من الإنتاج العالمي."}, {"id": "vbank4-12", "track": "verbal", "set": "vbank46", "type": "استيعاب المقروء", "q": "تقل روسيا ثلاثة أرباع مليون نسمة في السنة، فكم مليونًا تقل في العقد؟", "opts": ["٧,٧٥", "٠,٥", "٧,٥", "٨,٥"], "a": 2, "ex": "", "passage": "كشفت «سياسة الانفتاح» أن عدد الروس ينخفض خلال العام الواحد بثلاثة أرباع المليون نسمة.. وهذا الرقم الرهيب سببه تردي مستوى الرعاية الصحية بحيث تراجع متوسط عمر الذكور إلى ٥٩ سنة والإناث إلى ٧٢ سنة، وارتفعت معدلات الوفيات ١٨٪ في حين لم تعد النساء تفكر بالإنجاب بتاتًا (... ويقال إن من أهم أسباب حل الاتحاد السوفيتي السابق أن المسلمين كانوا سيشكلون بمعدل تناسلهم الكبير النسبة الغالبية في الاتحاد قبل نهاية الربع الأول من القرن الحالي)!!\n— نص آخر —\nأكدت عدة وسائل إعلام روسية أن روسيا تواجه مشكلة في انخفاض عدد السكان، حيث إنها تعاني أزمة سكانية حادة تتمثل في الانخفاض الحاد في عدد السكان وانتشار الأمراض الصحية والاجتماعية والنفسية في المجتمع الروسي، فوفقًا لبعض الإحصاءات فإنهم ينقصون بمقدار ٧٥٠ ألف نسمة كل عام، ويرجع ذلك إلى تدني الرعاية الصحية إذ انخفض متوسط أعمار الرجال إلى ٥٩ سنة والنساء إلى ٧١ سنة، كما أن هناك عزوفًا عن الإنجاب لدى الشعب الروسي لأسباب كثيرة تجعل النساء الروسيات يعزفن عن الإنجاب مثل الانتشار الواسع للطلاق (٧٥٪ من حالات الزواج)، وسوء التخطيط العائلي، وانخفاض مستوى المعيشة، وانتشار الفقر، والخوف من المستقبل في ظل الأوضاع الاقتصادية والاجتماعية التي تمر بها روسيا حاليًا، ويمكن أن نلمس خوفهم في صحيفة موسكو التي ما زالت تنشر مقالات بعنوان «روسيا ٢٠٢٥-٢٠٥٠»، ناهيك عن بعض المفاهيم التي غدت تتصدر تلك المقالات من نوعية أن الروس سيصبحون أقلية وهاجس انقراض الروس، وفي ظل هذه الظروف إلا أن عدد مسلمي روسيا والذين يربو عددهم عن ٢٠ مليون نسمة يشهد تزايدًا مستمرًا بسبب إقبالهم على التعدد ورغبتهم في الإنجاب الذي حث عليه الدين الإسلامي، ولو لم يتفكك الاتحاد السوفيتي لأصبح المسلمون أغلبية فيه بحلول القرن المقبل."}, {"id": "vbank23-4", "track": "verbal", "set": "vbank47", "type": "تناظر لفظي", "q": "خطبة : حماس", "opts": ["طعام : شبع", "غضب : غيظ", "فكرة : أفكار", "سرعة : عداء"], "a": 0, "ex": "العلاقة: نتيجة لسبب"}, {"id": "vbank3-4", "track": "verbal", "set": "vbank47", "type": "تناظر لفظي", "q": "العمر : الشيخوخة", "opts": ["البراءة : الطفولة", "القصيدة : الوزن", "الرواية : الملحمة", "الصيف : السفر"], "a": 1, "ex": "العلاقة: نهايته"}, {"id تزخر بثروات ضخمة من النفط والغاز الطبيعي والمعادن المشعة والرمال الزجاجية (رمال السيليكا) والطاقة الشمسية. وهي لم تعد خالية، على العكس مما يوحي اسمها؛ إذ تنتشر فيها محطات ومراكز شرطة، وتجوب الطائرات والسيارات سماءها وأرضها منقبة عن مدخراتها المعدنية."}, {"id": "vbank21-11", "track": "verbal", "set": "vbank47", "type": "استيعاب المقروء", "q": "يمكن استبدال كلمة (لكنها) بـ:", "opts": ["بل", "ما زالت", "هي"], "a": 0, "ex": "", "passage": "المواد الدراسية\nالمواد الدراسية ليست فقط تلقين الطفل للمعلومات، لكنها تعطي طرقًا لتعود الطفل على حل المشكلات. ويجب أن تكون المواد الدراسية وسيلة وليست غاية. يكون منهج التفكير العلمي أساسًا في حل المشكلات وطريقة في الحياة وأساسًا في تقويم التلاميذ."}, {"id": "vbank48-2", "track": "verbal", "set": "vbank48", "type": "تناظر لفظي", "q": "معول : صخرة", "opts": ["ورقة : كتاب", "فأس : شجرة", "قلم : يراع"], "a": 1, "ex": "العلاقة: يتعامل مع"}, {"id": "vbank12-3", "track": "verbal", "set": "vbank48", "type": "تناظر لفظي", "q": "لباس : حشمة", "opts": ["عيش : لقمة", "حديث : لطافة", "لين : سهولة", "سعادة : لقاء"], "a": 1, "ex": "العلاقة: يجب أن يتصف بـ"}, {"id": "vbank2-4", "track": "verbal", "set": "vbank48", "type": "تناظر لفظي", "q": "يلبي : يجيب", "opts": ["يعد : يفي", "ينظر : يصيب", "يتجلد : يتصبر", "يتعمد : يترقب"], "a": 2, "ex": "العلاقة: ترادف"}, {"id": "vbank30-5", "track": "verbal", "set": "vbank48", "type": "إكمال الجمل", "q": "استقبل النقاد الأدبيون الكتابات الأدبية الحديثة بـ ....... تارة والحماس تارة أخرى، وتنبؤوا بمستقبل مشرق للكتابة في الجيل الجديد، ومع ذلك فإنك قلما تجد شاعرًا حديثًا مبدعًا إلا و....... أقلام الحساد بشيء من الخبث والحسد.", "opts": ["التحفظ - تناولته", "الاندفاع - نعتته"], "a": 0, "ex": ""}, {"id": "vbank45-6", "track": "verbal", "set": "vbank48", "type": "إكمال الجمل", "q": "الشخص ....... هو الذي يحول الحجارة التي يرميها عليه الآخرون إلى أساس ثابت.", "opts": ["الناجح", "المكافح", "الحازم", "الطيب"], "a": 0, "ex": ""}, {"id": "vbank14-8", "track": "verbal", "set": "vbank48", "type": "الخطأ السياقي", "q": "من الأف       <h3>${E?"تعديل السؤال":"سؤال جديد"}</h3>
      <div class="fld"><label for="aPassage">نص القطعة (لاستيعاب المقروء فقط، اختياري)</label><textarea id="aPassage">${E&&E.passage?esc(E.passage):""}</textarea></div>
      <div class="fld"><label for="aQ">نص السؤال</label><textarea id="aQ" style="min-height:64px">${E?esc(E.q):""}</textarea></div>
      <div class="fld"><span class="lb">الاختيارات · اضغطي على الحرف لتحديد الإجابة الصحيحة</span>
        ${L.map((l,k)=>`<div class="optin"><button type="button" class="bub" data-correct="${k}" aria-pressed="${ADM.correct===k}" aria-label="الإجابة الصحيحة ${l}">${l}</button><div class="fld" style="flex:1"><input type="text" id="aO${k}" value="${E?esc(E.opts[k]||""):""}" aria-label="الاختيار ${l}"></div></div>`).join("")}
      </div>
      <div class="fld"><label for="aEx">الشرح (اختياري)</label><textarea id="aEx" style="min-height:56px">${E&&E.ex?esc(E.ex):""}</textarea></div>
      ${ADM.msg?`<div class="msg ${ADM.msg[0]}">${ADM.msg[1]}</div>`:""}
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-accent" type="submit">${E?"حفظ التعديل":"إضافة السؤال"}</button>${E?`<button class="btn btn-ghost" type="button" data-act="canceledit">إلغاء التعديل</button>`:""}</div>`
      :`
      <h3>إضافة عدة أسئلة دفعة واحدة</h3>
      <div class="fmt">اكتبي كل سؤال بهذا الشكل، وافصلي بين الأسئلة بسطر فاضي:

السؤال: قلم : كتابة
أ) مقص : قص
ب) ورقة : شجرة
ج) حبر : لون
د) كتاب : مكتبة
الإجابة: أ
الشرح: علاقة أداة ووظيفتها (اختياري)
القطعة: ... (اختياري، لاستيعاب المقروء)</div>
      <div class="fld"><label for="aBulk">الأسئلة</label><textarea id="aBulk" style="min-height:220px"></textarea></div>
      ${ADM.bulkMsg?`<div class="msg ${ADM.bulkMsg[0]}">${ADM.bulkMsg[1]}</div>`:""}
      <div><button class="btn btn-accent" type="submit">إضافة الأسئلة للقسم المختار</button></div>`}
    </form>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><h3 style="font-size:20px">الأسئلة المضافة (<span class="num" id="admCount">٠</span>)</h3><span style="flex:1"></span>
      <div class="fld" style="min-width:180px"><select id="aFilter" aria-label="تصفية حسب القسم"><option value="all">كل الأقسام</option>${[...DATA.verbal.sections,...DATA.verbal.banks,...DATA.quant.sections,...DATA.quant.banks].map(s=>`<option value="${s.id}" ${ADM.filter===s.id?"selected":""}>${s.name}</option>`).join("")}</select></div></div>
    <div class="mlist admin-list" id="admList"></div>
  </div>`;
  adminList();
}
const toEn=s=>s.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
function parseBulk(txt){
  const blocks=txt.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean),out=[],bad=[];
  const LM={"أ":0,"ا":0,"إ":0,"ب":1,"ج":2,"د":3};
  blocks.forEach((b,i)=>{
    const q={opts:[],a:null,q:"",ex:"",passage:""};
    b.split("\n").map(x=>x.trim()).filter(Boolean).forEach(line=>{
      let m;
      if(m=line.match(/^(?:السؤال)\s*[:：]\s*(.*)$/))q.q=m[1];
      else if(m=line.match(/^([أاإبجد])\s*[)\-.:]\s*(.*)$/))q.opts[LM[m[1]]]=m[2];
      else if(m=line.match(/^(?:الإجابة|الاجابة|الجواب)\s*[:：]\s*([أاإبجد])/))q.a=LM[m[1]];
      else if(m=line.match(/^(?:الشرح)\s*[:：]\s*(.*)$/))q.ex=m[1];
      else if(m=line.match(/^(?:القطعة|النص)\s*[:：]\s*(.*)$/))q.passage=m[1];
      else if(!q.q)q.q=line;
    });
    if(q.q&&q.opts.filter(Boolean).length===4&&q.a!=null)out.push(q);else bad.push(i+1);
  });
  return {out,bad};
}
async function adminSubmit(){
  const tr=document.getElementById("aTrack").value,set=document.getElementById("aSet").value;
  if(!DB)return;
  if(ADM.mode==="one"){
    const q=document.getElementById("aQ").value.trim(),opts=L.map((_,k)=>document.getElementById("aO"+k).value.trim());
    const passage=document.getElementById("aPassage").value.trim(),ex=document.getElementById("aEx").value.trim();
    if(!q||opts.some(o=>!o)){ADM.msg=["no","اكتبي نص السؤال والاختيارات الأربعة."];return admin()}
    if(ADM.correct==null){ADM.msg=["no","اضغطي على حرف الإجابة الصحيحة."];return admin()}
    const body={track:tr,set,q,opts,a:ADM.correct,ex,passage,t:ADM.edit?(byId(ADM.edit).t||Date.now()):Date.now()};
    try{
      if(ADM.edit)await DB.collection("questions").doc(ADM.edit).set(body);else await DB.collection("questions").add(body);
      ADM.msg=["ok",ADM.edit?"تم حفظ التعديل.":"تمت إضافة السؤال."];ADM.edit=null;ADM.correct=null;ADM.track=tr;ADM.set=set;
    }catch(e){ADM.msg=["no",e&&e.code==="quota_exceeded"?"امتلأت مساحة الأسئلة. احذفي أسئلة قديمة ثم حاولي.":"تعذّر الحفظ. تأكدي من الاتصال وأن لديك صلاحية التعديل."]}
    admin();
  }else{
    const {out,bad}=parseBulk(document.getElementById("aBulk").value);
    if(!out.length){ADM.bulkMsg=["no","لم أجد أسئلة مكتملة. تأكدي أن كل سؤال فيه ٤ اختيارات وسطر «الإجابة»."];return admin()}
    let ok=0,base=Date.now();
    for(const [k,q] of out.entries()){try{await DB.collection("questions").add({...q,track:tr,set,t:base+k});ok++}catch(e){break}}
    ADM.track=tr;ADM.set=set;
    ADM.bulkMsg=[ok===out.length&&!bad.length?"ok":"no",`أُضيف ${AR(ok)} سؤال.`+(bad.length?` لم تُضف الأسئلة رقم: ${bad.map(AR).join("، ")} لأنها ناقصة.`:"")+(ok<out.length?" توقف الحفظ بسبب خطأ في الاتصال.":"")];
    admin();
  }
}

/* ============ الاختبار ============ */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(list,title,mode,setId,back){
  quiz={list,title,mode,setId,back,i:0,ans:[],start:Date.now()};
  setNav(back);renderQuiz();window.scrollTo(0,0);
}
const VTYPE={analogy:"تناظر لفظي",completion:"إكمال الجمل",error:"الخطأ السياقي",odd:"المفردة الشاذة",reading:"استيعاب المقروء"};
const qType=q=>q.type||(q.track==="verbal"?VTYPE[q.set]:"")||"";
let passHidden=false;
function qHtml(q){let s=esc(q.q);if(qType(q)!=="الخطأ السياقي")return s;
  [...q.opts].sort((a,b)=>b.length-a.length).forEach(o=>{const e=esc(o),re=new RegExp("((?:^|[^\\u0621-\\u0652<>u\"=])[\\u0648\\u0641]?[\\u0628\\u0644\\u0643]?)("+e.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?=$|[^\\u0621-\\u0652])");s=s.replace(re,"$1<u class=\"uw\">$2</u>")});return s}
function renderQuiz(){
  const z=quiz;
  if(z.i>=z.list.length)return renderResult();
  const q=z.list[z.i],picked=z.ans[z.i];
  const done=picked!=null;
  main.innerHTML=`<div class="quiz">
    <div class="qbar"><button class="btn btn-ghost" data-act="exit" style="padding:8px 14px">خروج</button>
      <span class="ttl">${esc(z.title)}</span><span class="sp"></span><span class="num label">${AR(z.i+1)} / ${AR(z.list.length)}</span></div>
    <div class="dots" aria-hidden="true">${z.list.map((x,k)=>`<i class="${k===z.i?"cur":""} ${z.ans[k]!=null?(z.ans[k]===z.list[k].a?"ok":"no"):""}"></i>`).join("")}</div>
    <div class="qcard">
      <div class="qhead"><span class="label">${trackName(q.track)} · ${setName(q.set)}</span>${starBtn(q.id)}</div>
      ${q.passage?`<div class="pwrap"><div class="phead"><span class="label">النص</span><button class="ptog" data-act="ptoggle" aria-expanded="${!passHidden}">${passHidden?"إظهار النص":"إخفاء النص"}</button></div>${passHidden?"":`<div class="passage">${esc(q.passage)}</div>`}</div>`:""}
      ${qType(q)?`<span class="qtype">${qType(q)}</span>`:""}
      <div class="qtext">${qHtml(q)}</div>
      <div class="opts">${q.opts.map((o,k)=>{let c="";if(done){if(k===q.a)c="correct";else if(k===picked)c="wrong"}
        return `<button class="opt ${c}" data-opt="${k}" ${done?"disabled":""}><span class="bub">${L[k]}</span><span>${esc(o)}</span></button>`}).join("")}</div>
      ${done?`<div class="feedback ${picked===q.a?"ok":"no"}"><b>${picked===q.a?(z.prevMist&&z.prevMist[z.i]?"إجابة صحيحة، حُذف من أخطائك":"إجابة صحيحة"):"إجابة خاطئة، حُفظ في أخطائك"}</b><span>${esc(q.ex||"")}</span></div>`:""}
    </div>
    <div class="qactions"><span></span>
      <button class="btn btn-ink" data-act="next" ${done?"":"disabled"}>${z.i===z.list.length-1?"عرض النتيجة":"السؤال التالي"}</button></div>
  </div>`;
}
function answer(k){
  const z=quiz,q=z.list[z.i];if(z.ans[z.i]!=null)return;
  (z.prevMist=z.prevMist||[])[z.i]=!!S.mistakes[q.id];
  z.ans[z.i]=k;S.answered++;S.res[q.id]=(k===q.a);
  const st=S.sets[q.set]||(S.sets[q.set]={seen:[]});st.seen=st.seen||[];if(!st.seen.includes(q.id))st.seen.push(q.id);
  if(k===q.a){S.correct++;delete S.mistakes[q.id]}
  else{const m=S.mistakes[q.id]||{n:0};m.n++;m.t=Date.now();S.mistakes[q.id]=m}
  save();updateBadge();renderQuiz();
}
function renderResult(){
  const z=quiz,c=z.ans.filter((a,k)=>a===z.list[k].a).length,p=Math.round(c/z.list.length*100);
  if(z.setId){const st=S.sets[z.setId]||(S.sets[z.setId]={seen:[]});st.best=Math.max(st.best||0,p);save()}
  const wrong=z.list.filter((q,k)=>z.ans[k]!==q.a);
  const mins=Math.max(1,Math.round((Date.now()-z.start)/60000));
  main.innerHTML=`<div class="quiz"><div class="qcard result">
    <span class="label">${esc(z.title)}</span>
    <div class="score-ring" style="--p:${p}"><div><b>${AR(p)}٪</b></div></div>
    <h2 style="font-family:var(--f-display);font-weight:400;font-size:32px">${p>=90?"ممتاز!":p>=70?"أحسنتِ":p>=50?"جيد، واصلي":"تحتاجين مراجعة"}</h2>
    <p class="note" style="margin:0">${AR(c)} صحيحة من ${AR(z.list.length)} · ${AR(wrong.length)} خاطئة · قرابة ${AR(mins)} ${mins>2&&mins<11?"دقائق":"دقيقة"}</p>
    <div class="acts">
      ${wrong.length?`<button class="btn btn-accent" data-act="retrywrong">أعيدي الأخطاء (${AR(wrong.length)})</button>`:""}
      <button class="btn btn-ink" data-act="again">إعادة الاختبار</button>
      <button class="btn btn-ghost" data-act="exit">رجوع</button>
    </div></div></div>`;
}

/* ============ التوجيه ============ */
const VIEWS={home,verbal,quant,mistakes,saved};
function route(){quiz=null;confirmReset=false;let r=location.hash.slice(1);if(!VIEWS[r])r="home";setNav(r);VIEWS[r]();updateBadge()}
function go(r){if(location.hash.slice(1)===r)route();else location.hash=r;window.scrollTo(0,0)}
window.addEventListener("hashchange",route);

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.id==="logo")return go("home");
  if(t.dataset.go){lessonOpen=null;return go(t.dataset.go)}
  if(t.dataset.tab){quantTab=t.dataset.tab;lessonOpen=null;return quant()}
  if(t.dataset.lesson){lessonOpen=t.dataset.lesson;quant();window.scrollTo(0,0);return}
  if(t.dataset.vtab){PICK.verbal.tab=t.dataset.vtab;return verbal()}
  if(t.dataset.pick){const [tr,id]=t.dataset.pick.split(":"),P=PICK[tr];P.sel=P.sel.includes(id)?P.sel.filter(x=>x!==id):[...P.sel,id];return VIEWS[tr]()}
  if(t.dataset.pickall){const tr=t.dataset.pickall,P=PICK[tr],secs=DATA[tr].sections.filter(s=>qsOf(s.id).length).map(s=>s.id);P.sel=P.sel.length===secs.length?[]:secs;return VIEWS[tr]()}
  if(t.dataset.cnt){const [tr,n]=t.dataset.cnt.split(":");PICK[tr].n=+n;return VIEWS[tr]()}
  if(t.dataset.mf){mFilter=t.dataset.mf;return mistakes()}
  if(t.dataset.sf){sFilter=t.dataset.sf;return saved()}
  if(t.dataset.star){const id=t.dataset.star;S.saved[id]?delete S.saved[id]:(S.saved[id]=Date.now());save();updateBadge();
    if(quiz){const nb=document.createElement("div");nb.innerHTML=starBtn(id);t.replaceWith(nb.firstChild);return}
    return (location.hash==="#saved"?saved:mistakes)()}
  if(t.dataset.rm){delete S.mistakes[t.dataset.rm];save();updateBadge();return mistakes()}
  if(t.dataset.set){const s=allSets().find(x=>x.id===t.dataset.set);return startQuiz(qsOf(s.id),s.name,"set",s.id,s.track)}
  if(t.dataset.opt!=null&&quiz)return answer(+t.dataset.opt);
  if(t.dataset.amode){ADM.mode=t.dataset.amode;ADM.msg=ADM.bulkMsg=null;return admin()}
  if(t.dataset.correct!=null){ADM.correct=+t.dataset.correct;document.querySelectorAll("[data-correct]").forEach(b=>b.setAttribute("aria-pressed",b===t));return}
  if(t.dataset.aedit){const q=byId(t.dataset.aedit);ADM.mode="one";ADM.edit=q.id;ADM.track=q.track;ADM.set=q.set;ADM.correct=q.a;ADM.msg=null;admin();window.scrollTo(0,0);return}
  if(t.dataset.askdel){ADM.del=t.dataset.askdel;return adminList()}
  if(t.dataset.adel){const id=t.dataset.adel;ADM.del=null;DB&&DB.collection("questions").doc(id).delete().catch(()=>{});return}
  const a=t.dataset.act;
  if(a==="ptoggle"){passHidden=!passHidden;return renderQuiz()}
  if(a==="lessonback"){lessonOpen=null;quant();window.scrollTo(0,0);return}
  if(a==="nodel"){ADM.del=null;return adminList()}
  if(a==="canceledit"){ADM.edit=null;ADM.correct=null;ADM.msg=null;return admin()}
  if(a==="mquiz"){let ids=Object.keys(S.mistakes).filter(byId);if(location.hash==="#mistakes"&&mFilter!=="all")ids=ids.filter(id=>byId(id).track===mFilter);if(ids.length)startQuiz(shuffle(ids.map(byId)),"اختبار الأخطاء","mist",null,"mistakes")}
  if(a==="custom"){const tr=t.dataset.track,P=PICK[tr];let l=shuffle(Q().filter(q=>P.sel.includes(q.set)));if(P.n)l=l.slice(0,P.n);if(l.length)startQuiz(l,"تدريب حسب المهارة","custom",null,tr)}
  if(a==="squiz"){let ids=Object.keys(S.saved).filter(byId);if(sFilter!=="all")ids=ids.filter(id=>byId(id).track===sFilter);if(ids.length)startQuiz(shuffle(ids.map(byId)),"اختبار المحفوظة","saved",null,"saved")}
  if(a==="next"){quiz.i++;renderQuiz();window.scrollTo(0,0)}
  if(a==="exit"){const b=quiz.back;quiz=null;go(b)}
  if(a==="again")startQuiz(quiz.mode==="mist"?shuffle(quiz.list):quiz.list,quiz.title,quiz.mode,quiz.setId,quiz.back);
  if(a==="retrywrong"){const w=quiz.list.filter((q,k)=>quiz.ans[k]!==q.a);startQuiz(w,quiz.title+" · الأخطاء","mist",null,quiz.back)}
  if(a==="reset"){confirmReset=true;mistakes()}
  if(a==="noreset"){confirmReset=false;mistakes()}
  if(a==="doreset"){S={mistakes:{},saved:{},answered:0,correct:0,sets:{},res:{}};save();confirmReset=false;updateBadge();mistakes()}
});
document.addEventListener("submit",e=>{if(e.target.id==="admForm"){e.preventDefault();adminSubmit()}});
document.addEventListener("change",e=>{
  if(e.target.id==="aTrack"){ADM.track=e.target.value;ADM.set=setsFor(ADM.track)[0].id;const s=document.getElementById("aSet");s.innerHTML=setsFor(ADM.track).map(x=>`<option value="${x.id}">${x.name}</option>`).join("")}
  if(e.target.id==="aSet")ADM.set=e.target.value;
  if(e.target.id==="aFilter"){ADM.filter=e.target.value;adminList()}
});
route();

</script>
