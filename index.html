<style>
/* Layout concept: an exam answer sheet — bubble rows, ruled lines and a highlighter mark the one thing to look at. */
:root{
  --paper:#ECEFF4; --sheet:#FFFFFF; --ink:#0D1A2B; --muted:#5B6678; --line:#D5DBE5;
  --accent:#FFD23F; --accent-ink:#2A2200; --brand:#1F3C88; --brand-soft:#E3E9F7;
  --good:#0F8A5F; --good-soft:#DFF3EA; --bad:#C8343B; --bad-soft:#FBE4E5;
  --shadow:0 1px 0 rgba(13,26,43,.06),0 8px 24px -12px rgba(13,26,43,.18);
  --f-display:"Lalezar","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0B1220; --sheet:#121B2C; --ink:#E8EDF5; --muted:#93A0B5; --line:#243248;
  --accent:#FFD23F; --accent-ink:#2A2200; --brand:#8FA9F2; --brand-soft:#1B2742;
  --good:#3CC48F; --good-soft:#12302A; --bad:#F06B70; --bad-soft:#3A1A20;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B1220; --sheet:#121B2C; --ink:#E8EDF5; --muted:#93A0B5; --line:#243248;
  --accent:#FFD23F; --accent-ink:#2A2200; --brand:#8FA9F2; --brand-soft:#1B2742;
  --good:#3CC48F; --good-soft:#12302A; --bad:#F06B70; --bad-soft:#3A1A20;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:10px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
.label{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted)}

/* header */
.hinit{margin-top:22px;display:inline-block;font-weight:700;font-size:15px;color:var(--brand);background:var(--brand-soft);border-radius:12px;padding:8px 14px;line-height:1.6}
.fin{color:var(--ink);font-weight:700;font-size:14px;margin-bottom:4px}
.splash{position:fixed;inset:0;z-index:50;background:var(--paper);display:grid;place-items:center;padding:24px;transition:opacity .4s}
.splash.out{opacity:0;pointer-events:none}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;animation:pop .5s ease-out}
.sp-mark{transform:scale(1.8);margin-bottom:10px}
.sp-name{font-family:var(--f-display);font-size:clamp(44px,12vw,72px);line-height:1.1;color:var(--ink)}
.sp-by{font-size:clamp(16px,4.5vw,20px);font-weight:700;color:var(--brand);max-width:22ch;line-height:1.6}
@media (prefers-reduced-motion:reduce){.sp-in{animation:none}.splash{transition:none}}
.p95{font-family:var(--f-mono);font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 6px;font-size:.85em}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sheet);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:none;border:0;padding:0}
.logo-mark{display:grid;grid-template-columns:repeat(2,10px);gap:3px}
.logo-mark i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink)}
.logo-mark i.on{background:var(--ink)}
.logo b{font-family:var(--f-display);font-size:24px;font-weight:400;line-height:1}
nav.tabs{display:flex;gap:4px;margin-inline-start:auto}
nav.tabs button{background:none;border:0;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--sheet)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;display:inline-grid;place-items:center;font-family:var(--f-mono)}
.badge[data-zero]{display:none}
nav.tabs button[hidden]{display:none}
.badge.star{background:var(--accent);color:var(--accent-ink)}
.star-btn{background:var(--sheet);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);transition:border-color .12s,background .12s}
.star-btn:hover{border-color:var(--ink)}
.star-btn svg{fill:none;stroke:currentColor}
.star-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.star-btn[aria-pressed="true"] svg{fill:currentColor}
.star-btn.sm{padding:4px 8px}
.qhead{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.mitem .x.s{background:var(--accent);color:var(--accent-ink)}
.mitem .acts{display:flex;gap:4px;align-items:center;flex:none}
@media (max-width:720px){
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:9;margin:0;background:var(--sheet);border-top:1px solid var(--line);
    padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));justify-content:space-around}
  nav.tabs button{flex-direction:column;gap:2px;font-size:12px;padding:6px 6px;border-radius:12px;position:relative}
  nav.tabs button svg{display:block}
  nav.tabs .badge{position:absolute;top:0;inset-inline-end:2px;min-width:18px;height:18px;font-size:11px}
  main{padding-bottom:24px}
  body footer{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:721px){nav.tabs button svg{display:none}}

main{padding-block:28px 64px}
.view{display:flex;flex-direction:column;gap:28px}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center;padding-block:12px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,8vw,84px);line-height:1.05}
.hero h1 mark{background:linear-gradient(transparent 52%,var(--accent) 52%,var(--accent) 92%,transparent 92%);color:inherit;padding:0 .08em}
.hero p{color:var(--muted);font-size:18px;max-width:46ch;margin:14px 0 0}
.sheet-art{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.sheet-art .row{display:flex;align-items:center;gap:12px}
.sheet-art .qn{width:28px;color:var(--muted);font-size:13px}
.sheet-art .b{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);font-weight:600}
.sheet-art .b.f{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.sheet-art .b.x{background:var(--bad);border-color:var(--bad);color:#fff}
.sheet-art .b.ok{border-color:var(--good);color:var(--good)}
.sheet-art .foot{border-top:1px dashed var(--line);padding-top:10px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
@media (max-width:760px){.hero{grid-template-columns:1fr}.sheet-art{display:none}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sheet);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.stats>div{padding:16px 18px;border-inline-start:1px solid var(--line);min-width:0}
.stats>div:first-child{border-inline-start:0}
.stats .v{font-family:var(--f-mono);font-size:28px;font-weight:600;line-height:1.2}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.stats>div:nth-child(3){border-inline-start:0}.stats>div:nth-child(n+3){border-top:1px solid var(--line)}}

/* tracks */
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:620px){.tracks{grid-template-columns:1fr}}
.track{all:unset;cursor:pointer;background:var(--sheet);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.track:hover{transform:translateY(-2px);border-color:var(--ink)}
.track:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.track .big{font-family:var(--f-display);font-size:44px;line-height:1}
.track .meta{display:flex;gap:16px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.track .glyph{position:absolute;inset-inline-start:18px;top:12px;font-family:var(--f-display);font-size:96px;line-height:1;color:var(--brand-soft);pointer-events:none}
.track .t{position:relative;display:flex;flex-direction:column;gap:6px;padding-inline-start:0}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}

.mist-cta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--ink);color:var(--sheet);border-radius:20px;padding:20px 22px}
.mist-cta h3{font-size:20px}
.mist-cta p{margin:2px 0 0;opacity:.75;font-size:14px}
.mist-cta .grow{flex:1;min-width:200px}

/* buttons */
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-ink{background:var(--ink);color:var(--sheet)}
.btn-ghost{background:transparent;border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* section pages */
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px}
.page-head h1{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,6vw,56px);line-height:1.05}
.page-head p{margin:0;color:var(--muted);flex-basis:100%}
.seg{display:inline-flex;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:4px;margin-inline-start:auto}
.seg button{border:0;background:none;padding:8px 18px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.set{all:unset;cursor:pointer;background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.set:hover{border-color:var(--ink)}
.set:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.set .head{display:flex;align-items:center;gap:12px}
.set .code{width:44px;height:44px;flex:none;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-family:var(--f-display);font-size:22px}
.set h3{font-size:17px}
.set p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.set .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.neutral{background:var(--brand-soft);color:var(--brand)}
.picker{background:var(--sheet);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:18px}
.picker h3{font-size:18px}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.skill{display:flex;align-items:center;gap:12px;text-align:start;background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:600}
.skill:hover{border-color:var(--ink)}
.skill .bub{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center}
.skill[aria-pressed="true"]{border-color:var(--ink);background:var(--brand-soft)}
.skill[aria-pressed="true"] .bub{background:var(--ink);border-color:var(--ink)}
.skill[aria-pressed="true"] .bub::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--sheet)}
.skill small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.counts button{border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 16px;font-weight:600;font-family:var(--f-mono)}
.counts button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.picker .go{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:16px}
.form{background:var(--sheet);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px}
.form h3{font-size:18px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.fld .lb{font-size:14px;font-weight:600}
.fld input[type=text],.fld textarea,.fld select{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.fld textarea{min-height:84px;resize:vertical;line-height:1.7}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--brand)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.optin{display:flex;align-items:center;gap:10px}
.optin .bub{width:32px;height:32px;flex:none;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-weight:700;color:var(--muted);cursor:pointer;background:none}
.optin .bub[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.optin input{flex:1}
.msg{border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.msg.ok{background:var(--good-soft);color:var(--good)} .msg.no{background:var(--bad-soft);color:var(--bad)}
.fmt{background:var(--paper);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.9;white-space:pre-wrap;color:var(--muted);overflow-x:auto}
.admin-list .mitem .x{background:var(--brand-soft);color:var(--brand)}
.empty{background:var(--sheet);border:1.5px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted)}

/* quiz */
.quiz{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:18px}
.qbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.qbar .ttl{font-weight:700}
.qbar .sp{flex:1}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dots i.cur{border-color:var(--ink)}
.dots i.ok{background:var(--good);border-color:var(--good)}
.dots i.no{background:var(--bad);border-color:var(--bad)}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px}
.pwrap{display:flex;flex-direction:column;gap:8px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ptog{font:inherit;font-size:13px;font-weight:700;color:var(--brand);background:var(--brand-soft);border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
.qtype{align-self:flex-start;font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:8px;padding:3px 10px}
u.uw{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px;text-decoration-color:var(--brand)}
.passage{white-space:pre-line;max-height:46vh;overflow:auto;background:var(--paper);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.9;border-inline-start:4px solid var(--brand)}
.qtext,.mitem .q{white-space:pre-line}
.qtext{font-size:21px;font-weight:600;line-height:1.7}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:start;background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .bub{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .bub{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.feedback{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback b{font-size:16px}
.feedback.ok b{color:var(--good)} .feedback.no b{color:var(--bad)}
.feedback span{font-size:15px}
.qactions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}

.result{text-align:center;align-items:center}
.score-ring{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0)}
.score-ring div{width:136px;height:136px;border-radius:50%;background:var(--sheet);display:grid;place-items:center}
.score-ring b{font-family:var(--f-mono);font-size:36px;line-height:1}
.result .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* mistakes list */
.mlist{display:flex;flex-direction:column;gap:10px}
.mitem{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start}
.mitem .x{width:30px;height:30px;flex:none;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.mitem .body{flex:1;min-width:0}
.mitem .q{font-weight:600}
.mitem .m{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.mitem .rm{background:none;border:0;color:var(--muted);padding:4px 8px;border-radius:8px;font-size:13px}
.mitem .rm:hover{color:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap}

.filters button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}

.note{font-size:13px;color:var(--muted)}

.chap{display:flex;flex-direction:column;gap:12px}

.lbody p{margin:0}
.rule{border-inline-start:4px solid var(--brand);background:var(--brand-soft);border-radius:10px;padding:10px 14px;font-weight:500}
.tip{border-inline-start:4px solid var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--sheet));border-radius:10px;padding:10px 14px}
.lex{border:1px dashed var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.lex .q{font-weight:700}
.lex .sol{color:var(--muted)}
.lex .sol b{color:var(--good)}
.lgo{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--sheet);border-radius:18px;padding:18px 20px}
.lgo h3{margin:0;font-size:18px}.lgo .note{color:color-mix(in srgb,var(--sheet) 70%,transparent)}
.lgo .grow{flex:1;min-width:180px}
.lnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lnav .btn{font-size:14px;padding:8px 14px}

, "track": "verbal", "set": "vbank2", "type": "تناظر لفظي", "q": "سيف : غمد", "opts": ["سهم : كنانة", "كتاب : حقيبة", "محفظة : بطاقة"], "a": 0, "ex": "العلاقة: يوضع في"}, {"id": "vbank9-1", "track": "verbal", "set": "vbank2", "type": "تناظر لفظي", "q": "أنهار : مياه", "opts": ["معادن : ذهب", "قصائد : أدب", "كواكب : أرض", "جبال : هضاب"], "a": 1, "ex": "العلاقة: جزء من"}, {"id": "vbank14-2", "track": "verbal", "set": "vbank2", "type": "تناظر لفظي", "q": "فاضل : زائد", "opts": ["ناقص : مليء", "زيارة : عيادة", "مفضول : كثير", "زيادة : نقص"], "a": 1, "ex": "العلاقة: ترادف"}, {"id": "vbank8-3", "track": "verbal", "set": "vbank2", "type": "تناظر لفظي", "q": "ركض : جري", "opts": ["عداء : رياضة", "هرولة : مشي", "إرادة : قوة", "صبر : جلد"], "a": 3, "ex": "العلاقة: ترادف"}, {"id": "vbank18-5", "track": "verbal", "set": "vbank2", "type": "إكمال الجمل", "q": "إذا لم تكن مستعدًا لقبول ....... فلست ناضجًا لقبول .......", "opts": ["الحق - الباطل", "الصدق - المجاملة", "اللوم - النقد", "الذم - المديح"], "a": 2, "ex": ""}, {"id": "vbank40-6", "track": "verbal", "set": "vbank2", "type": "إكمال الجمل", "q": "من لاح له ....... الآخرة هان عليه ....... الدنيا.", "opts": ["كمال - فراق", "فوز - هزيمة", "تمام - وداع", "قوة - ترك"], "a": 0, "ex": ""}, {"id": "vbank8-7", "track": "verbal", "set": "vbank2", "type": "الخطأ السياقي", "q": "إذا نظرت في حياة شخص جاد سترى في حياته نصيبًا كبيرًا من اللامبالاة.", "opts": ["حياة", "شخص", "كبيرًا", "اللامبالاة"], "a": 3, "ex": "الصواب: المعاناة، الصعاب"}, {"id": "vbank42-7", "track": "verbal", "set": "vbank2", "type": "الخطأ السياقي", "q": "الشتاء ربيع المؤمن، صبحه قصير للصيام، وليله طويل للقيام.", "opts": ["الشتاء", "المؤمن", "صبحه", "طويل"], "a": 2, "ex": "الصواب: نهاره"}, {"id": "vbank25-10", "track": "verbal", "set": "vbank2", "type": "استيعاب المقروء", "q": "تشير الفقرة (٣) إلى أن:", "opts": ["التنمية تؤدي إلى النمو", "النمو يؤدي إلى التنمية", "التنمية والنمو يؤدي كل منهما إلى الآخر", "التنمية والنمو لا يؤدي أي منهما إلى الآخر"], "a": 0, "ex": "", "passage": "التنمية والنمو\n(١) يخلط البعض بين مفهومي التنمية والنمو، باعتبارهما مفهومين مترادفين، رغم ما بينهما من تباين في عدد من الأوجه. فالنمو يتضمن عملية تغيير تلقائية تحدث من غير تدخل من جانب الإنسان، أو أن هذا التدخل يكون محدودًا وفي جانب واحد غالبًا. أما التنمية فتشير إلى عملية تغيير متعمدة محكومة بإرادة إنسانية وبجهود منظمة لتحقيق أهداف تمس حياة الإنسان بأكملها.\n(٢) كما أن مقدار التغير الحادث من طريق النمو عادة ما يكون ضئيلًا وأقرب إلى التغيير الكمي. أما التغيير المصاحب للتنمية فهو تغيير عميق وسريع وأقرب إلى التغيير الكيفي. فالنمو يحدث عن طريق التطور البطيء والتحول التدريجي، أما التنمية فتحتاج إلى دفعة قوية تخرج المجتمع من حالة الركود والتخلف إلى حالة التقدم والازدهار.\n(٣) وأخيرًا فإن النمو مستوعب في التنمية، في حين ليس من الضروري أن يفضي كل نمو إلى تنمية. لذا يمكن القول إن الدول النامية ليست في حاجة إلى مجرد النمو، وإنما هي في حاجة إلى التنمية المبنية على القدرة والخصائص الذاتية لكل دولة. ويظهر الفرق بين مفهوم التنمية ومفهوم التقدم من حقيقة أن عملية التنمية ومستواها يمكن التحقق منها عمليًا وموضوعيًا، أما التقدم فهو حكم قيمي وتفسير ذاتي ونسبي؛ يختلف باختلاف الإطار الفلسفي والفكري لكل مجتمع."}, {"id": "vbank28-12", "track": "verbal", "set": "vbank2", "type": "استيعاب المقروء", "q": "ما هي طبيعة المسك؟", "opts": ["صلبة", "سائلة", "غازية", "متحول"], "a": 1, "ex": "", "passage": "المسك مادةٍ عطريةٍ تفرزها الغدة الكيسية في بطن غزال المسك، حيث توجد الغدة الكيسية عند غزلان المسك الذكور فقط، وحجمها بمقدار بيضة الدجاج، وتكون درجة لزوجة المسك كالعسل، ورائحته قوية، إذ إنّه يعمل كجاذبٍ جنسي في الحيوان، ويستخدم أيضًا في العطور كرائحةٍ ومثبتٍ للعطور، ومن جانبٍ آخر تسمى أكياس المسك في التجارة بقرون المسك، والإفرازات المجففة تسمى حبوب المسك، ويتمّ الحصول على المسك من فأر المسك وقط الزباد أيضًا، كما أنّ بعض النباتات تنتج الزيوت التي تشبه المسك، وتشمل بذور نبات الكركديه، ونبات فيرولا في آسيا الوسطى وتركستان."}, {"id": "vbank31-10", "track": "verbal", "set": "vbank2", "type": "استيعاب المقروء", "q": "يمكن استبدال (إلا أنها) الواردة في النص بـ:", "opts": ["رغم أنها", "غير أنها", "كما أنها", "حيث إنها"], "a": 1, "ex": "", "passage": "البطاطس\nالبطاطس من أشهر الخضروات في أوروبا وأمريكا، وهي تزرع في جميع أنحاء العالم إلا أنها لم تنتقل إلى أوروبا إلا في القرن السادس عشر ...... المناخ. البطاطس أنقذت العالم لأنها رخيصة السعر، وهي مفيدة وغنية بمصادر مفيدة مثل المعادن ومواد أخرى، يتكوّن الجزء الأكبر من البطاطس من الماء، حيث يُشكّل نحو ٨٠٪ من وزنها، تمثل المواد الصلبة حوالي ٢٠٪ من تركيبها الكلي، ويُعد النشا المكوّن الرئيس فيها، ويشكّل النشا نحو ٨٠٪ من هذه المواد الصلبة، مما يعكس أهميته في القيمة الغذائية للبطاطس، لذا تُعتبر البطاطس بذلك مصدرًا غنيًا بالطاقة والنشويات، وتعكس هذه الخصائص دور البطاطس الأساسي في الأنظمة الغذائية المتوازنة. في عام ٢٠٠٧ كانت الصين تمتلك ٧٠ مليون طن من البطاطس وهي تمثل ٢٠٪ من الإنتاج العالمي."}, {"id": "vbank3-10", "track": "verbal", "set": "vbank2", "type": "استيعاب المقروء", "q": "ذُكر في النص أن حرارة الجمل تتراوح بين ٣٤ إلى ٤١، وهذا يدل على:", "opts": ["قدرة تأقلم الجمل مع أي بيئة", "تحمل الجمل لدرجات الحرارة العالية", "تحكمه في درجة حرارته", "قدرته على العيش في مناطق جغرافية متباينة"], "a": 1, "ex": "", "passage": "الجمل\n١. يُعدّ الجمل من الحيوانات الأليفة المنتشرة في الخليج العربي، وهو من أكثر الحيوانات قدرةً على التكيّف مع بيئة الصحراء القاسية، لذلك يُعرف باسم «سفينة الصحراء». وقد وهبه الله رقبة طويلة تساعده على الأكل من الأرض وقضم أوراق الأشجار العالية، مما يجعله قادرًا على العيش في الأماكن التي يقل فيها العشب والماء.\n٢. يتميّز الجمل بقوة تحمّله وصبره العجيب، فهو يتحمل الجوع والعطش لفترات طويلة دون أن يضعف، حتى لو خارت قواه وفقد شيئًا من وزنه يظل صابرًا متحمّلًا، لا يجزع ولا ينهار، ولذلك كان خير رفيقٍ للإنسان في الترحال والسفر عبر الصحارى الواسعة.\n٣. كان للعرب أنواع من الجمال الأصيلة، منها الجمال الكندرية التي تُستخدم للزينة والجمال في المناسبات، والجمال العادية التي تُستخدم للركوب والترحال وحمل الأمتعة. وقد كانت لهذه الأنواع مكانة خاصة عند العرب، إذ اعتمدوا عليها في حياتهم اليومية، فكانت رمزًا للقوة والصبر والعزّة.\n٤. ومع مرور الزمن، ظهرت أنواع وافدة من الجمال جاءت من خارج الجزيرة العربية، مثل الجمل الصومالي والجمل الباكستاني والجمل الإثيوبي، وغيرها من الأنواع التي انتقلت إلى البلاد العربية واستُخدمت لأغراض مختلفة.\n٥. ومن الناحية العلمية، يوجد نوعان فقط من الجمال في العالم، هما: الجمل العربي ذو السنام الواحد الذي يعيش في المناطق الحارة كجزيرة العرب، والجمل البكتري (أو البيكتيري) ذو السنمين الذي يعيش في المناطق الباردة. وهذان النوعان هما الأصل في جميع الجمال المنتشرة حول العالم.\n٦. لقد كان الجمل على مرّ العصور رمزًا للصبر والتحمّل، وقد سخّره الله لخدمة الإنسان، فاستفاد منه في طعامه وشرابه وسفره، حتى صار الجمل عنوانًا على القوة والثبات والتكيّف مع الطبيعة القاسية."}, {"id": "vbank3-9", "track": "verbal", "set": "vbank2", "type": "استيعاب المقروء", "q": "أي الآتي ذُكر في النص وهو مخالف لسياق النص؟", "opts": ["يخسر بعضًا من وزنه", "يفقد قواه", "قضم الأوراق", "سلالات وافدة"], "a": 1, "ex": "", "passage": "الجمل\n١. يُعدّ الجمل من الحيوانات الأليفة المنتشرة في الخليج العربي، وهو من أكثر الحيوانات قدرةً على التكيّف مع بيئة الصحراء القاسية، لذلك يُعرف باسم «سفينة الصحراء». وقد وهبه الله رقبة طويلة تساعده على الأكل من الأرض وقضم أوراق الأشجار العالية، مما يجعله قادرًا على العيش في الأماكن التي يقل فيها العشب والماء.\n٢. يتميّز الجمل بقوة تحمّله وصبره العجيب، فهو يتحمل الجوع والعطش لفترات طويلة دون أن يضعف، حتى لو خارت قواه وفقد شيئًا من وزنه يظل صابرًا متحمّلًا، لا يجزع ولا ينهار، ولذلك كان خير رفيقٍ للإنسان في الترحال والسفر عبر الصحارى الواسعة.\n٣. كان للعرب أنواع من الجمال الأصيلة، منها الجمال الكندرية التي تُستخدم للزينة والجمال في المناسبات، والجمال العادية التي تُستخدم للركوب والترحال وحمل الأمتعة. وقد كانت لهذه الأنواع مكانة خاصة عند العرب، إذ اعتمدوا عليها في حياتهم اليومية، فكانت رمزًا للقوة والصبر والعزّة.\n٤. ومع مرور الزمن، ظهرت أنواع وافدة من الجمال جاءت من خارج الجزيرة العربية، مثل الجمل الصومالي والجمل الباكستاني والجمل الإثيوبي، وغيرها من الأنواع التي انتقلت إلى البلاد العربية واستُخدمت لأغراض مختلفة.\n٥. ومن الناحية العلمية، يوجد نوعان فقط من الجمال في العالم، هما: الجمل العربي ذو السنام الواحد الذي يعيش في المناطق الحارة كجزيرة العرب، والجمل البكتري (أو ال ", "انشغال الأطفال بالسلع عن عملهم", "يجب التقليل من سعر السلع مراعاة لفقرهم", "وجود الأموال في أيدي الأطفال بدون فائدة"], "a": 0, "ex": "", "passage": "عمالة الأطفال\n١- يزداد اهتمام العالم بالطفولة ومشكلاتها سنة بعد أخرى؛ إذ أخذت الدول والمنظمات المحلية والإقليمية والدولية تخصص لها البرامج والمؤتمرات من أجل مزيد من التوجيه والإرشاد والرعاية.\n٢- من أكبر المشكلات التي يعاني منها الطفل مشكلة العمل، مصطلح عمل الأطفال يستحضر في الذهن حقيقة معقدة كما يقول تقرير عن وضع الأطفال في العالم صدر عام ١٩٩٧م، ذلك إن عمل الطفل بشكل سلسلة متصلة في أحد طرفيها عمل محفوف بالمخاطر والاستغلال، وفي الطرف الآخر عمل يعزز نمو الطفل من غير تأثير في تعليمه واستجمامه.\n٣- إن مجموع عدد الأطفال العاملين في العالم رقم يعاني من افتقار المصداقية بسبب أن بعض الدول لا تولي عملهم أهمية إحصائية من منطلق أنه لا داعي لشمول البيانات الرسمية إحصاءات لا داعي لوجودها.\n٤- يضاف إلى ذلك أن جزءًا من الأطفال يعمل في قطاعات غائبة عنها الرقابة الرسمية المباشرة كالبيوت والمزارع والحقول والمصانع اليدوية الصغيرة، وكل ما هو معروف عن عدد الأطفال العاملين في مختلف أنحاء العالم هو أنه رقم يصل إلى تسع خانات معظمهم في الدول الفقيرة ذات النسب السكانية العالية.\n٥- قد بينت الدراسات أن الأطفال يلجؤون مضطرين إلى ممارسة أعمال ضارة بصحتهم ونمائهم بسبب ثلاثة عوامل أولها: استغلال حالة الفقر التي تعيشها أسرهم، فغالبًا ما يكون آباء هؤلاء الأطفال وأمهاتهم عاطلين عن العمل أو إنهم يعملون بأجر زهيد.\n٦- أما ثالثها، فهو قيود التقاليد عند بعض الفئات الاجتماعية التي بدأ أفرادها بالعمل منذ نعومة أظفارهم بحيث أصبحت سمة شبه وراثية، ومما زاد الطين بلة في نظر الباحثين أن الأجيال الجديدة من هذه الفئات الاجتماعية صارت أكثر تطلعًا إلى تلك السلع الاستهلاكية ذات الأثمان المرتفعة.\n٧- ولعل أسوأ صور معاناة الأطفال جراء عملهم أن بعض الآباء قد يعمدون إلى الزج بأطفالهم عند صاحب عمل معين للوفاء بما له عليهم من ديون فيصبح الطفل، والحالة هذه، أشبه ما يكون برهينة إلى سداد الدين. ومن الصور السيئة أيضًا عمل الأطفال في الشوارع، وهم ليسوا أطفال شوارع كما يشاع، في بيع الزهور أو تنظيف الشوارع أو حمل الأمتعة للناس ليعودوا في نهاية اليوم إلى الأحياء الفقيرة التي ي بالتلقائية، على حين أن كل فعل واعٍ أي مدرك بالعقل يسمى الفعل الإرادي.\n٢- يقوم الوجدان أحيانًا بوظيفة المنشط والمساعد على تحقيق الفعل الإرادي؛ وذلك حينما نميل إلى ما هو مستحب عندنا أو مقبول، فنعمل على تحقيقه ونهرب من العكس. ومن ثم تدخل الأحاسيس في طيات الفعل الإرادي إلى جانب الإدراك والوعي. ويعمل المزاج الانفعالي الجيد وقوة الإحساس على سرعة الاستجابة الإرادية ودقتها، وإذا كانت هذه القوة النفسية في حالة غير جيدة فإننا سنفقد الفعل الإرادي حتمًا. وينبغي أن نشير إلى أن كلمة الوجدان لا تستخدم إلا في سياق الحديث عن الحياة النفسية الراقية.\n٣- ويرى بعض العلماء أن الإرادة تقترن بالجهد، وهنا يمكن أن نسأل عن حال الفعل الصادر عن العادة وبخاصة الفعل الذي ينفذ من غير جهد ومن غير انتباه، أهو فعل إرادي أم غير إرادي؟\nيمكن في واقع الأمر أن نميز بين نوعين من العادة: أحدهما العادة التي تتسم بالسلبية ومناقضة الإرادة وتتصف بالخمول والضعف ويذعن لها بعض الناس، وهي ليست بغريبة عن الإرادة التي كثيرًا ما تعمل على مواجهتها؛ لإيقاف ممارستها أو لإضعافها.\n٤- والنوع الآخر عادة غير إرادية ولكنها مفيدة ترقى بسلوك الإنسان وتجعله أكثر إنتاجية، بمعنى أن يقوم بجهد منظم يؤدي إلى الإنجاز في وقت قصير، وذلك كالنجار وعامل البناء والكاتب، وإذا حللنا أساس هذا النوع من العادة وجدناه فعلًا إراديًا حصل تعلمه بعد جهد ثم أصبح مع الزمن فعلًا آليًا أطلقنا عليه اسم العادة فحسب. والأحرى بنا أن نضيف الإرادة إلى اسم هذا النوع لتكن صفة له.\n٥- والبنية النفسية للفعل الإرادي شديدة التعقيد، وقد بسطها قدماء النفسيين بقولهم: إنها تتركب من تصور الهدف، وهو ما سمي حضور الفعل قبل تنفيذه، يليها الحوار الذاتي سعيًا إلى وزن الأمور للتمييز بين (الضد) و(غير الضد)، وتدخل هنا البواعث والعلل، أي: العوامل الثقافية والاجتماعية وطبيعة ذهن الفرد إلى جانب العوامل الوجدانية، أما المرحلة التالية فتتمثل في القرار الذي يعقبه التنفيذ العملي، أي: ترجمة القرار إلى فعل.\n٦- وعن تربية الإرادة نقول بإيجاز: تتضافر مجموعة عوامل لتربية الإرادة، منها ما يتعلق بالصحة العامة للإنسان، ومنها عناصر النظام التربوي التي تقوي الثقة بالنفس وتزرع نزعة المبادرة والتفكير على نحو منطقي، والقدرة على تحديد الهدف مع الرؤية الشمولية لمعطيات الحالة، ومنها المحيط الاجتماعي السليم الذي يسعى لتنمية المشاعر السامية والحفاظ على الحماسة لمواجهة التردد والشك وتنمية الاستعداد الوجداني والذهني للعمل بروح فريق.\n٧- وكلما ازدادت العادات الإرادية عند الإنسان في مجال ما ازدادت قدرته على سرعة تحقيق إرادات أخرى تنتمي إلى نفس المجال، فالذي اعتاد أن يضحي بالعاطفة أمام العقل والواجب بلا تردد؛ فإنه يتغلب تلقائيًا على الصعوبات التي تواجهه بسبب الصراع بينهما، أما علاقة الإرادة بالوراثة فحديث ذو شجون لا يستوعبها المقام."}, {"id": "vbank43-9", "track": "verbal", "set": "vbank6", "type": "استيعاب المقروء", "q": "التلويح بالهجر يعني:", "opts": ["التهديد بالقطيعة", "التحلّي بالكره", "الإشارة إلى الحقد", "إضمار الغل"], "a": 0, "ex": "", "passage": "التهديد بالقطيعة\nما أجمل أن نُرزق ببشر لا يحملون غلًا، ولا يضمرون حقدًا، ولا يلوّحون بهجر، يبسطون لنا جناح الرفق، ويَحدبون علينا بما يحملون في جوانبهم من قلوب كبيرة."}, {"id": "vbank35-13", "track": "verbal", "set": "vbank6", "type": "استيعاب المقروء", "q": "علاقة جملة (وقررت انتشال الغواصة...) بما قبلها:", "opts": ["تعليلية", "تفسير", "تفصيل", "تأكيد"], "a": 3, "ex": "", "passage": "الغواصة الروسية\nكانت إحدى الغواصات الروسية تتبختر خارج حدود المياه الإقليمية للولايات المتحدة الأمريكية. وفجأة وبدون أسباب معروفة هز انفجار مروع أجزاء الغواصة فهوت إلى أعماق المحيط وفي داخلها أكثر من مئة بحار ومتخصص.\nولم تكن هذه الغواصة من النوع العادي على الإطلاق، بل كانت واحدة من أحدث ما أنتجته تقنية الاتحاد السوفيتي في ذلك الوقت، إضافة إلى أنها كانت تضم عددًا من الصواريخ النووية وأجهزة التصويب المتقدمة. وحدث أن أطلقت الغواصة قبل غرقها إشارة استغاثة ضعيفة لم تستطع البحرية السوفيتية التقاطها، بينما تمكن الأمريكان من ذلك واستطاعوا بفضلها تحديد مكان الغواصة لاحقًا ومرت شهور طويلة والأسطول السوفيتي يبحث في قاع المحيط بدون كلل أو ملل، ولكن لا حياة لمن تنادي!\nأما بالنسبة للولايات المتحدة فقد فضلت التغاضي عن الحادث وقررت انتشال الغواصة للاطلاع على التقنية السوفيتية المتقدمة في هذا المجال. ولم تكشف أمريكا عن هذا السر إلا بعد أن انتهت من تنفيذ أضخم عملية انتشال في التاريخ استمرت لسبع سنوات شارك فيها ٤٠٠٠ شخص، غير العلماء والمتخصصين، وكلفت ما يربو على ٣٥٠ مليون دولار بأسعار ذلك الوقت وأحيطت بسرية شديدة!"}, {"id": "vbank47-9", "track": "verbal", "set": "vbank6", "type": "استيعاب المقروء", "q": "يفهم من النص أن الذي يقنع بما لديه يكون .......", "opts": ["راضيًا", "ساخطًا", "ناقمًا", "حاقدًا"], "a": 0, "ex": "", "passage": "يبحث الناس دائمًا عما ليس في أيديهم، فقلما يقتنع الناس بما لديهم."}, {"id": "vbank25-13", "track": "verbal", "set": "vbank6", "type": "استيعاب المقروء", "q": "يفهم من النص أن:", "opts": ["حليب الأم يقلل الإصابة بمرض الأمعاء", "الذين يتناولون حليب الأم لا يصابون بمرض الأمعاء", "الحليب الصناعي يسبب الإصابة بمرض الأمعاء", "أضرار الحليب الصناعي أكثر من أضرار حليب الأم"], "a": 0, "ex": "", "passage": "الرضاعة\nمرض الأمعاء يصيب الأطفال الذين يتناولون الحليب الصناعي ٣ أضعاف الأطفال الذين يتناولون حليب الأم."}, {"id": "vbank25-2", "track": "verbal", "set": "vbank7", "type": "تناظر لفظي", "q": "طائرة : سيارة", "opts": ["دراجة : صاروخ", "الزهرة : الأرض", "شجاعة : جسارة", "القطار : العربة"], "a": 1, "ex": "العلاقة: فئة"}, {"id": "vbank34-2", "track": "verbal", "set": "vbank7", "type": "تناظر لفظي", "q": "قيلولة : نهار", "opts": ["ماشية : رعي", "ظهر : فراش", "غذاء : نوم", "سحور : فجر"], "a": 3, "ex": "العلاقة: يكون في"}, {"id": "vbank2-2", "track": "verbal", "set": "vbank7", "type": "تناظر لفظي", "q": "غضب : حلم", "opts": ["قتل : سجن", "جوع : شبع", "لعب : نوم", "دراسة : إجازة"], "a": 1, "ex": "العلاقة: تضاد"}, {"id": "vbank13-2", "track": "verbal", "set": "vbank7", "type": "تناظر لفظي", "q": "شلال : ماء", "opts": ["بركان : نار", "جبل : حصى", "غابة : أشجار", "صحراء : رمال"], "a": 0, "ex": "العلاقة: يصدر منه"}, {"id": "vbank28-5", "track": "verbal", "set": "vbank7", "type": "إكمال الجمل", "q": "المعلم الكفء هو أساس نجاح العملية ....... وبه تصلح ....... ويستقيم حالها.", "opts": ["التعليمية - الأجيال", "التربوية - الطرق", "الاقتصادية - الأمم"], "a": 0, "ex": ""}, {"id": "vbank38-6", "track": "verbal", "set": "vbank7", "type": "إكمال الجمل", "q": "إن لحظة ....... تساوي أحيانًا حياة من الخبرة.", "opts حربي فيتضمن أيضًا الهجوم والمناورة وإطلاق الصواريخ والقنابل."}, {"id": "vbank40-9", "track": "verbal", "set": "vbank7", "type": "استيعاب المقروء", "q": "يفهم من سياق الفقرة (٤) أن كلمة «قصبة» تعني:", "opts": ["مدينة علمية", "مكان هجرة", "مركزًا اقتصاديًا", "عاصمة سياسية"], "a": 3, "ex": "", "passage": "الإمام مالك\n(١) الإمام مالك بن أنس - رحمه الله - أتاه الله تعالى بسطة في العلم والجسم والخلق، وهي صفات نادرة. وقد اختار أن يكون درسه في مسجد رسول الله ﷺ، ثالث المساجد التي تُشدّ إليها الرحال، وأكبر حلقة علمية في ذلك التاريخ. واختار أن يكون موضع جلوسه المكان الذي كان يجلس فيه عمر بن الخطاب رضي الله عنه في قضائه وتدبيره شئون الدولة، وفتاويه للناس. وكان من حُسْن الاختيار أنه سكن في المنزل الذي كان ينزل فيه عبد الله بن مسعود رضي الله عنه؛ فكان العلم يُظِلُّ فكره في المكان، كما كان يُظِلّه في كل أعماله وكل الأزمان.\n(٢) وقد وُلد في أسرة اشتهرت بالرواية ونشأ بين رواة محدّثين؛ ولذلك اتجه، بعد أن حفظ القرآن الكريم وتفصّح بالعربية، إلى طلب علم الرواية والفقه. وبعد أن وعى ما أدركه من علم أهل عصره؛ اتجه عند نضجه إلى الدرس.\nوقد تحدث أهل المدائن والأمصار باسمه، فكانت فتاويه تُنشر وتذاكر في مصر والشام، وبلاد المغرب كلها، والأندلس.\n(٣) إن تلك المكانة ما جاءته عفوًا، بل لها أسباب من نشأته، ومن جهوده، ومن شيوخه، ومن شخصه؛ مما أدى إلى فيض علمه الغزير واستنباطه الفقهي السليم، وإدراك مصالح الناس والعلم بالقرآن والسنة، وتنقيح الرواية ونقدها بدراية عميقة مُدرِكة. وقد عاش في عصر ماجَتْ فيه فتَنٌ كموج البحر، وكان هو يركب سفينة النجاة، ولا يخوض فيها، ويستنقذ الدين والعلم والفقه بشخصه القوي.\n(٤) وقد كانت البيئة العامة كبيئته الخاصة توجهه نحو المعرفة وطلب الرواية. فقد وُلد وعاش بمدينة رسول الله ﷺ، ومنزل الشرع الإسلامي، ومعقل حكم الإسلام الأول إذ كانت قصبة الدولة الإسلامية في عهد أبي بكر وعمر وعثمان وعلي رضي الله عنهم.\n(٥) وكانت للمدينة أيضًا تلك المنزلة العلمية في العهد الأموي؛ إذ كانت مهد السنن والفتاوى المأثورة، حتى لقد كان الحاكم العادل عمر بن عبد العزيز - رحمه الله - يكتب إلى الأمصار يعلمهم السنن والفقه، ويكتب إلى أهل المدينة يسألهم عما مضى، ويعمل بما عندهم.\n(٦) وكان في درسه يبتعد عن الغُلوّ، ولم تكن فيه جفوة ولا خشونة، وقد قال بعض تلاميذه: كان إذا جلس معنا كأنه واحد منا، يتبسّط معنا في الحديث، وهو أشد تطامنًا منا له، فإذا أخذ في حديث رسول الله ﷺ تهيّبنا كلامه، كأننا ما عرفناه ولا عرفنا."}, {"id": "vbank14-10", "track": "verbal", "set": "vbank7", "type": "استيعاب المقروء", "q": "كل ما يلي ضد كلمة (يستحسن) عدا:", "opts": ["يستقبح", "يستشنع", "يستبشع", "يستغرب"], "a": 3, "ex": "", "passage": "إني رأيت أنه لا يكتب إنسانٌ كتابًا في يومه إلا قال في غده: لو غُيِّر هذا لكان أحسن، ولو زيد كذا لكان يُستحسن، ولو قُدِّم هذا لكان أفضل، ولو ترك هذا لكان أجمل. وهذا من أعظم العبر، وهو دليل على استيلاء النقص على جملة البشر."}, {"id": "vbank24-11", "track": "verbal", "set": "vbank7", "type": "استيعاب المقروء", "q": "من مميزات القراءة الصامتة:", "opts": ["استيعاب واستخلاص المفردات المطبوعة", "تساعد على استقلالية الأطفال في القراءة", "فاعليتها في تحقيق الأهداف", "تميز وتفسر الكلمات المطبوعة"], "a": 2, "ex": "", "passage": "القراءة الصامتة عملية تتطابق..... وهي أفضل من القراءة الشفهية لأنها تساعد في تحقيق المبتغى، الطفل لا بد أن يبدأ في تعلمها منذ وقت مبكر لأنها ستفيده عندما يكبر ويعتمد على نفسه في دراسته للمقررات الدراسية."}, {"id": "vbank14-3", "track": "verbal", "set": "vbank8", "type": "تناظر لفظي", "q": "نطفة : جنين", "opts": ["دين : هم", "غيوم : مطر", "مراهقة : طفولة", "تلوث : دخان"], "a": 1, "ex": "العلاقة: يصبح"}, {"id": "vbank28-1", "track": "verbal", "set": "vbank8", "type": "تناظر لفظي", "q": "قطع : قطف", "opts": ["فصل : فصم", "قصف : قصد", "نام : قام", "سأل : جاد"], "a": 0, "ex": "العلاقة: ترادف"}, {"id": "vbank16-2", "track": "verbal", "set": "vbank8", "type": "تناظر لفظي", "q": "ذهب : ذهاب", "opts": ["جلس : جلوس", "غفر : غفار", "عمل : عمال", "رجع : راجع"], "a": 0, "ex": "العلاقة: كلمة من وزن، وكلمة من وزن آخر"}, {"id": "vbank14-1", "track": "verbal", "set": "vbank8", "type": "تناظر لفظي", "q": "طبيعة : نسيم", "opts": ["فوح : عطر", "شفق : سماء", "نغم : إيقاع", "غسق : غروب"], "a": 2, "ex": "العلاقة: له"}, {"id": "vbank11-5", "track": "verbal", "set": "vbank8", "type": "إكمال الجمل", "q": "من ....... أن الدول ....... لم تعط القدر الكافي من الاهتمام للغة العربية كما تفعل الدول الأخرى مع لغاتها.", "opts": ["المحزن - العربية", "المخجل - الغربية"], "a": 0, "ex": ""}, {"id": "vbank23-6", "track": "verbal", "set": "vbank8", "type": "إكمال الجمل", "q": "معرفة كيفية ....... الآخرين يمكننا من ....... سلوكياتهم المختلفة عنا.", "opts": ["تفكير - تقبل", "تعامل - رفض"], "a": 0, "ex": ""}, {"id": "vbank3-8", "track": "verbal", "set": "vbank8", "type": "الخطأ السياقي", "q": "من استعصم بعقله مال، ومن استغنى بماله زال، ومن اعتمد على الناس حال.", "opts": ["مال", "زال", "الناس", "حال"], "a": 3, "ex": "الصواب: خاب، ضل"}, {"id": "vbank24-8", "track": "verbal", "set": "vbank8", "type": "الخطأ السياقي", "q": "لا تدخر ما تبقى بعد الاقتصاد، بل أنفق ما تبقى بعد الإدخار.", "opts": ["تدخر", "الاقتصاد", "أنفق", "الإدخار"], "a": 1, "ex": "الصواب: الإنفاق"}, {"id": "vbank46-12", "track": "verbal", "set": "vbank8", "type": "استيعاب المقروء", "q": "عدد ما يستفيده الناس من الأشجار كما في النص، هو:", "opts": ["٣", "٤", "٥", "٦"], "a": 1, "ex": "", "passage": "فوائد الشجر\nتمدُّ الأشجار الناس بالغذاء، والألياف، والعقاقير، منذ آلاف السنين، وأهم من ذلك أنها تزودهم بالأخشاب."}, {"id": "vbank48-10", "track": "verbal", "set": "vbank8", "type": "استيعاب المقروء", "q": "من الفقرة الثالثة، كل الاختيارات التالية يمكن استبدال كلمة (بنى) باستثناء:", "opts": ["قسّم", "رتّب", "شيّد", "وزّع"], "a": 2, "ex": "", "passage": "الوطواط\n١. جمال الدين محمد بن إبراهيم بن يحيى الأنصاري الكتبي، الملقب بالوطواط، وُلد بالقاهرة وعاش فيها حتى وفاته. عُرف في زمنه بأنه أديب مترسل وكاتب بارع، اشتُهر بحسن التعبير وإتقان الصياغة، فكان ضابطًا لمعانيه، متفننًا في عرض أفكاره، حتى عُدَّ من أبرز أدباء مصر في القرن السادس الهجري.\n٢. لم يقتصر الوطواط على مجال الأدب، بل كان فيلسوفًا واسع الاطلاع، كتب في موضوعات متعددة كالكيمياء والنبات والحيوان والفلك، وجمع بين الفكر والعلم والأدب ومن أشهر مؤلفاته كتاب غرر الخصائص الواضحة وعرر النقائص الفاضحة. وقد لقيت هذه المؤلفات تقدير العلماء، حتى إن الصفدي ترجم له في كتبه، وذكر فضله ومكانته بين مفكري عصره.\n٣. بنى الوطواط كتابه غرر الخصائص الواضحة على ستة عشر قسمًا، ثمانية منها تناول فيها الفضائل والشمائل، وثمانية أخرى عرض فيها النقائص والرذائل، فرتّب مادته ورتّب فصوله بعناية. وقد جمع في أسلوبه بين الحماقة والفصاحة، فكان نموذجًا للمفكر الذي يمزج الجد بالهزل، ويعرض المعاني الدقيقة في ثوب سهل ممتنع.\n— نص آخر —\nمحمد بن إبراهيم بن يحيى الأنصاري، المشهور بالوطواط، أديب بغدادي من أعلام القرن السابع الهجري، تميز ببلاغته واهتمامه بالعلوم والأدب عرف عنه اتساع الثقافة وحسن التعبير، وله مؤلفان بارزان هما: غرر الخصائص الواضحة ومباهج الفكر ومناهج العبر. وقد ترجم له الصفدي في كتبه، وامتدحه، معدًّا إياه من الأدباء المجيدين وأهل الفضل."}, {"id": "vbank22-9", "track": "verbal", "set": "vbank8", "type": "استيعاب المقروء", "q": "كم عدد الآثار المتبقية على القمر؟", "opts": ["٢", "٣", "٤", "٥"], "a": 1, "ex": "", "passage": "آثار الفضاء\nوصل رواد الفضاء إلى القمر في ست بعثات فضائية مأهولة أطلقها برنامج (أبولو)، وقد ترك هؤلاء على القمر بعد عودتهم إلى الأرض آثار العجلات لمركبات الاستكشاف وآثار الأقدام، وأجهزة عاكسة لأشعة الليزر.\nوتقدمت (ناسا) بمقترحات للمحافظة على المواقع التاريخية على سطح القمر، طالما أن حمايتها رسميًا من خلال تسجيلها على قائمة التراث العالمي أمر غير متاح، فحماية الأجرام السماوية لا تندرج ضمن اختصاصات منظمة اليونسكو، فضلًا عن أن معاهدة الفضاء الخارجي لعام ١٩٦٧ لا تعترف لأي دولة بحق ادعاء السيادة على القمر، ناهيك عن ترشيحه للتسجيل على قائمة التراث العالمي.\nوتهدف المقترحات إلى الاستفادة من الدروس المستخلصة من التجارب السابقة لبرنامج الفضاء الأمريكي؛ ومن ذلك: ضرورة الهبوط على مسافة لا تقل عن كيلومترين عن حدود الموقع تجنبًا لإغراقه بالغبار، أو أي آثار أخرى؛ إذ اقتُلع علم بعثة (أبولو) بفعل قوة الغازات المنبعثة من محرك المركبة، في حين مازالت بقية أعلام البعثات منتصبة."}, {"id": "vbank16-10", "track": "verbal", "set": "vbank8", "type": "استيعاب المقروء", "q": "نسبة ضحايا تسونامي إلى الكوارث الطبيعية تعادل تقريبًا:", "opts": ["٤٠٪", "٦٠٪", "٨٠٪", "٢٠٪"], "a": 0, "ex": "", "passage": "الكوارث (تسونامي)\nذكر مقال متخصص مطلع العام الجاري أن الكوارث أدت إلى خسارة كبيرة تقدر بـ (٩٠٠ مليار دولار) وخسائر بشرية تصل إلى ٧٠٠ ألف شخص، كما ذكر أن ٦٠٪ من الكوارث الطبيعية كانت زلازل، وهي من أكثر الكوارث الطبيعية فتكًا بالبشرية، وأن ٩٠٪ من إجمالي الخسائر البشرية كان في قارة آسيا، والأكثر هولًا هو إعصار تسونامي، فقد كان الأكثر فتكًا على المحيط الهندي، حيث أودى بخسائر تقدر بـ ٢٧٠ ألف شخص."}, {"id": "vbank27-10", "track": "verbal", "set": "vbank8", "type": "استيعاب المقروء", "q": "ما علاقة (وحقيقة الأمر أن الجود ..) بما قبلها؟", "opts": ["تعليلية", "تأكيد", "تعارض", "تفسيرية"], "a": 3, "ex": "", "passage": "حقيقة الجود\nمن جاد ساد ولم يكن له أعداء، وحقيقة الأمر أن الجود يدفع الشخص لبذل الخير."}, {"id": "vbank18-1", "track": "verbal", "set": "vbank9", "type": "تناظر لفظي", "q": "ممارسة : خبرة", "opts": ["استماع : تواصل", "عناية : اهتمام", "ترتيب : معرفة", "توزيع : تجميع"], "a": 0, "ex": "العلاقة: ضروري لـ"}, {"id": "vbank6-3", "track": "verbal", "set": "vbank9", "type": "تناظر لفظي", "q": "إتقان : جُهد", "opts": ["حزن : مصيبة", "نجاح : حليم", "سعادة : سرور", "خوف : رعب"], "a": 0, "ex": "العلاقة: نتيجة لسبب"}, {"id": "vbank17-2", "track": "verbal", "set": "vbank9", "type": "تناظر لفظي", "q": "قافية : قصيدة", "opts": ["حلم : يقظة", "عبق : أريج", "تكبيل : فك", "فرد : كوكبة"], "a": 3, "ex": "العلاقة: جزء لكل"}, {"id": "vbank17-1", "track": "verbal", "set": "vbank9", "type": "تناظر لفظي", "q": "نهر : ماء", "opts": ["وريد : دم", "تل : هضبة", "غرفة : جدار"], "a": 0, "ex": "العلاقة: يجري فيه"}, {"id": "vbank16-7", "track": "verbal", "set": "vbank9", "type": "إكمال الجمل", "q": "يسعى ....... لتعليم الطلاب ليصبحوا متفوقين ويحققوا الإنجازات ويفيدوا بلدهم ....... دخولهم سوق العمل.", "opts": ["النظام - قبل", "التعليم - حتى", "المعلم - بعد", "المجتمع - أثناء"], "a": 2, "ex": ""}, {"id": "vbank21-6", "track": "verbal", "set": "vbank9", "type": "إكمال الجمل", "q": "الحرب ....... وبلاء، وما ارتبطت بشيء إلا به .......", "opts": ["فتنة - المصائب", "فتح - القتل", "نصر - الحرية", "مشقة - الاستقرار"], "a": 0, "ex": ""}, {"id": "vbank41-7", "track": "verbal", "set": "vbank9", "type": "الخطأ السياقي", "q": "هجرة الأدمغة إلى بلاد الغرب لوجود الدعم المالي والتقني ينبغي أن تنحّى.", "opts": ["هجرة", "بلاد", "الدعم", "تنحّى"], "a": 3, "ex": "الصواب: تعالج"}, {"id": "vbank39-8", "track": "verbal", "set": "vbank9", "type": "الخطأ السياقي", "q": "صديقك مرآة لك، تتراءى فيها فتكشف لك عن نفسه، وتصدقك عن محاسنك وعيوبك.", "opts": ["مرآة", "نفسه", "تصدقك", "عيوبك"], "a": 1, "ex": "الصواب: نفسك"}, {"id": "vbank36-11", "track": "verbal", "set": "vbank9", "type": "استيعاب المقروء", "q": "تدعو العبارة إلى عدم:", "opts": ["الاستسلام", "الصعود", "التواكل", "التقدم"], "a": 0, "ex": "", "passage": "سلم النجاح لا يعاني من الازدحام في أعلاه."}, {"id": "vbank41-10", "track": "verbal", "set": "vbank9", "type": "استيعاب المقروء", "q": "الضمير في كلمة (منها) يعود على:", "opts": ["الحيوانات", "المحميات", "المنظمات"], "a": 0, "ex": "", "passage": "الحياة الفطرية\nتقوم الهيئات المختصة بإنشاء محميات لمنع الزحف السكني والحفاظ على الحيوانات وحمايتها خصوصًا القابل منها للانقراض.\nيجب على الجهات البيئية الاهتمام بالحياة الفطرية لما تحوي من توازن بيئي ما بين حيوانات ونباتات، ويجب الحد من الرعي الجائر وقطع الأشجار، لأنه يؤثر على التوازن البيئي، الفائدة من الحيوانات لا تقتصر فقط على الفرو والجلد واللحم، بل يجب المحافظة على الحيوانات والنباتات للمحافظة على سلامة البيئة. فأنشأت الحكومات المحميات لوضع الحيوانات المهددة بالانقراض فيها، ووضعها في الحدائق العامة لجذب الزوار وتجميل الأماكن.\nيساعد إنشاء المحميات على الحفاظ على قيمة الحياة الفطرية."}, {"id": "vbank17-8", "track": "verbal", "set": "vbank9", "type": "استيعاب المقروء", "q": "من آثار العفو الاجتماعية:", "opts": ["زوال البغضاء", "إكرام ضيف", "رد الأمانة", "حب الصدق"], "a": 0, "ex": "", "passage": "العفو يمحو الشحناء ويبدد العداوات والخصومات بين الناس، يعتقد البعض أنهم عندما يعفون عن الآخرين فإن هذا يقلل من مقامهم وشأنهم، أو أن هذا ينم عن ضعف، ولكن في الحقيقة هذا غير صحيح والعكس تمامًا هو الصحيح، فكلما زاد عفو الشخص دل ذلك على قوته."}, {"id": "vbank40-10", "track": "verbal", "set": "vbank9", "type": "استيعاب المقروء", "q": "أي الآتي يمكن استنتاجه من الفقرة (١)؟", "opts": ["الإمام مالك يبعث على الإعجاب والدهشة", "بُعد مقر تدريس الإمام مالك عن الشهرة", "معظم المساجد ذات المدارس ينبغي السفر إليها", "عمق مساهمة الإمام مالك في تدبير شؤون الدولة"], "a": 0, "ex": "", "passage": "الإمام مالك\n(١) الإمام مالك بن أنس - رحمه الله - أتاه الله تعالى بسطة في العلم والجسم والخلق، وهي صفات نادرة. وقد اختار أن يكون درسه في مسجد رسول الله ﷺ، ثالث المساجد التي تُشدّ إليها الرحال، وأكبر حلقة علمية في ذلك التاريخ. واختار أن يكون موضع جلوسه المكان الذي كان يجلس فيه عمر بن الخطاب رضي الله عنه في قضائه وتدبيره شئون الدولة، وفتاويه للناس. وكان من حُسْن الاختيار أنه سكن في المنزل الذي كان ينزل فيه عبد الله بن مسعود رضي الله عنه؛ فكان العلم يُظِلُّ فكره في المكان، كما كان يُظِلّه في كل أعماله وكل الأزمان.\n(٢) وقد وُلد في أسرة اشتهرت بالرواية ونشأ بين رواة محدّثين؛ ولذلك اتجه، بعد أن حفظ القرآن الكريم وتفصّح بالعربية، إلى طلب علم الرواية والفقه. وبعد أن وعى ما أدركه من علم أهل عصره؛ اتجه عند نضجه إلى الدرس.\nوقد تحدث أهل المدائن والأمصار باسمه، فكانت فتاويه تُنشر وتذاكر في مصر والشام، وبلاد المغرب كلها، والأندلس.\n(٣) إن تلك المكانة ما جاءته عفوًا، بل لها أسباب من نشأته، ومن جهوده، ومن شيوخه، ومن شخصه؛ مما أدى إلى فيض علمه الغزير واستنباطه الفقهي السليم، وإدراك مصالح الناس والعلم بالقرآن والسنة، وتنقيح الرواية ونقدها بدراية عميقة مُدرِكة. وقد عاش في عصر ماجَتْ فيه فتَنٌ كموج البحر، وكان هو يركب سفينة النجاة، ولا يخوض فيها، ويستنقذ الدين والعلم والفقه بشخصه القوي.\n(٤) وقد كانت البيئة العامة كبيئته الخاصة توجهه نحو المعرفة وطلب الرواية. فقد وُلد وعاش بمدينة رسول الله ﷺ، ومنزل الشرع الإسلامي، ومعقل حكم الإسلام الأول إذ كانت قصبة الدولة الإسلامية في عهد أبي بكر وعمر وعثمان وعلي رضي الله عنهم.\n(٥) وكانت للمدينة أيضًا تلك المنزلة العلمية في العهد الأموي؛ إذ كانت مهد السنن والفتاوى المأثورة، حتى لقد كان الحاكم العادل عمر بن عبد العزيز - رحمه الله - يكتب إلى الأمصار يعلمهم السنن والفقه، ويكتب إلى أهل المدينة يسألهم عما مضى، ويعمل بما عندهم.\n(٦) وكان في درسه يبتعد لتنمية فهو تغيير عميق وسريع وأقرب إلى التغيير الكيفي. فالنمو يحدث عن طريق التطور البطيء والتحول التدريجي، أما التنمية فتحتاج إلى دفعة قوية تخرج المجتمع من حالة الركود والتخلف إلى حالة التقدم والازدهار.\n(٣) وأخيرًا فإن النمو مستوعب في التنمية، في حين ليس من الضروري أن يفضي كل نمو إلى تنمية. لذا يمكن القول إن الدول النامية ليست في حاجة إلى مجرد النمو، وإنما هي في حاجة إلى التنمية المبنية على القدرة والخصائص الذاتية لكل دولة. ويظهر الفرق بين مفهوم التنمية ومفهوم التقدم من حقيقة أن عملية التنمية ومستواها يمكن التحقق منها عمليًا وموضوعيًا، أما التقدم فهو حكم قيمي وتفسير ذاتي ونسبي؛ يختلف باختلاف الإطار الفلسفي والفكري لكل مجتمع."}, {"id": "vbank15-10", "track": "verbal", "set": "vbank10", "type": "استيعاب المقروء", "q": "استعان العباسيون بالمماليك لأنهم:", "opts": ["أقوياء", "أوفياء", "محايدون", "محاربون"], "a": 2, "ex": "", "passage": "المماليك\nمرت قرون تخلى فيها العرب عن جلد الجندية، وشغلوا بترف البلاد التي فتحها الأجداد، وانشغلت أحزابهم بصراعات السلطة، فلجأت الخلافة العباسية في عهد المعتصم (١٧٩) (٢٢٧) هـ إلى استجلاب الجند المماليك، فكوّنت منهم قوة الجيش الضاربة، وعدة الدولة المحاربة، ظنًا منها أن غربتهم عن أجناس الدولة وحضارتها ستجعلهم أطوع في يد الخلافة، وأبعد عن أن يكونوا طرفًا في الصراع على السلطة، ولكن مخاطر الصراعات الداخلية، وأخطار استقلال أطرافها عن مركزها جعل الدولة تكثر من هؤلاء الجند المماليك حتى تضخمت مؤسستهم؛ فاستشعروا القوة التي جعلتهم يسيطرون على الدولة ويشكلون جبهة جديدة للصراع."}, {"id": "vbank8-11", "track": "verbal", "set": "vbank10", "type": "استيعاب المقروء", "q": "في النص (التصرف) يقابلها:", "opts": ["الإبحار", "العاصفة", "أثناء", "مثل"], "a": 0, "ex": "", "passage": "التصرف أثناء الغضب .. كالإبحار خلال العاصفة."}, {"id": "vbank36-4", "track": "verbal", "set": "vbank11", "type": "تناظر لفظي", "q": "قاضي : محكمة", "opts": ["قبطان : سفينة", "معلم : تلاميذ"], "a": 0, "ex": "العلاقة: موجود في"}, {"id": "vbank10-1", "track": "verbal", "set": "vbank11", "type": "تناظر لفظي", "q": "مزلاج : قفل", "opts": ["قمح : شعير", "سطح : درج", "سور : حديقة"], "a": ا بترف البلاد التي فتحها الأجداد، وانشغلت أحزابهم بصراعات السلطة، فلجأت الخلافة العباسية في عهد المعتصم (١٧٩) (٢٢٧) هـ إلى استجلاب الجند المماليك، فكوّنت منهم قوة الجيش الضاربة، وعدة الدولة المحاربة، ظنًا منها أن غربتهم عن أجناس الدولة وحضارتها ستجعلهم أطوع في يد الخلافة، وأبعد عن أن يكونوا طرفًا في الصراع على السلطة، ولكن مخاطر الصراعات الداخلية، وأخطار استقلال أطرافها عن مركزها جعل الدولة تكثر من هؤلاء الجند المماليك حتى تضخمت مؤسستهم؛ فاستشعروا القوة التي جعلتهم يسيطرون على الدولة ويشكلون جبهة جديدة للصراع."}, {"id": "vbank29-13", "track": "verbal", "set": "vbank12", "type": "استيعاب المقروء", "q": "عادة شكر الناس ينتج عنها:", "opts": ["التأمل", "المبادرة", "التعاون", "العلاقات"], "a": 3, "ex": "", "passage": "يجب علينا التأمل في نعم الله وشكره على هذه النعم، ويجب علينا شكر الناس، فهنالك أناس أحسنوا إلينا وعاملونا بطريقة طيبة ولا نعطيهم حقهم من الشكر، وإذا شكرنا الناس سيعود علينا بالخير."}, {"id": "vbank37-10", "track": "verbal", "set": "vbank12", "type": "استيعاب المقروء", "q": "الأكسجين في صفات الطبيعة يشبه:", "opts": ["الكربون", "الورقة", "الزهرة", "الماء"], "a": 3, "ex": "", "passage": "الأكسجين أكثر العناصر وفرة في الطبيعة، وهو غاز عديم اللون والطعم والرائحة، وبدونه لا وجود للكائنات الحية على الأرض، فنحن نستنشقه يوميًا مع الهواء، الذي يؤلف الأكسجين خمسه، كما أنه موجود في العديد من الأشياء، ففي البحار يتواجد الأكسجين مذابًا في الماء، كما يشكل جزءًا رئيسيًا من تركيبه، وفي الصخر يؤلف الأكسجين جزءًا رئيسيًا من معظم معادنه. يتألف الأكسجين العادي من جزيئات ثنائية الذرات، أما معظم الأكسجين في أعالي الجو فشكل آخر منه، إذ يتألف جزيئه من ثلاث ذرات ويعرف بالأوزون، وهو طبقة واقية حول الأرض تحجب الأشعة الفضائية المؤذية."}, {"id": "vbank42-13", "track": "verbal", "set": "vbank12", "type": "استيعاب المقروء", "q": "ما معنى (استقطاب) في جملة (استقطاب العلماء)؟", "opts": ["جلب", "استدعاء", "إغراء", "تفريق"], "a": 0, "ex": "", "passage": "(١) تقوم الدول المتقدمة خاصة أمريكا بجذب المفكرين والعلماء من الدول النامية وإغرائهم بالمال وتوفير كل سُبل الراحة لهم وتوفير كل الإمكانيات التي تساعدهم في أبحاثهم. فتلك العوامل الاقتصادية هي أكثر ما يجعل الناس ينتقلون من بلادهم.\n(٢) إلا أن الناحية الاقتصادية للتأثير على العلماء التي استخدمتها أمريكا لم تستطع إيطاليا برغم أنها بلد قليلة تحقيقها بسبب مشاكل نظامية وقوانينهم الصارمة، لذلك ينتقل إليها عدد قليل جدًا.\n(٣) العادات في اليابان غريبة، كان العامل الثقافي في اليابان الأكبر تأثيرًا على العلماء حيث إنهم لا يمكنهم ممارسة حياتهم بشكل طبيعي خارج المعمل، وأصبحوا يتجنبون النقل والعمل في اليابان بسبب اختلاف الثقافات وأن هذا يسبب لهم عائقًا."}, {"id": "vbank10-2", "track": "verbal", "set": "vbank13", "type": "تناظر لفظي", "q": "نهر : غابة", "opts": ["كهرباء : سلك", "سيارات : معرض", "ازدحام : ملعب", "مسجد : مئذنة"], "a": 0, "ex": "العلاقة: تتحرك في"}, {"id": "vbank5-4", "track": "verbal", "set": "vbank13", "type": "تناظر لفظي", "q": "عمامة : قميص", "opts": ["فراش : لحاف", "جورب : قدم", "ياقوتة : زمردة", "مجلس : أريكة"], "a": 2, "ex": "العلاقة: فئة"}, {"id": "vbank31-2", "track": "verbal", "set": "vbank13", "type": "تناظر لفظي", "q": "سرب : طير", "opts": ["قبيلة : رجل", "جماعة : قوم", "إصبع : يد", "شبل : أسد"], "a": 0, "ex": "العلاقة: مجموعة من"}, {"id": "vbank32-3", "track": "verbal", "set": "vbank13", "type": "تناظر لفظي", "q": "حماس : تهور", "opts": ["سخاء : تبذير", "لطف : عطف", "جود : كرم"], "a": 0, "ex": "العلاقة: شدتها"}, {"id": "vbank45-5", "track": "verbal", "set": "vbank13", "type": "إكمال الجمل", "q": "يجب الذهاب إلى الطبيب بشكل .......؛ لأن ....... خير من العلاج.", "opts": ["منتظم - التداوي", "دوري - الوقاية", "يومي - وقائي"], "a": 1, "ex": ""}, {"id": "vbank37-6", "track": "verbal", "set": "vbank13", "type": "إكمال الجمل", "q": "إذا شعر المخطئ ببشاعة ....... اقتنع بحاجته إلى .......، وصار قبوله أكثر، وقناعته أكبر.", "opts": ["خطئه - النصيحة", "وجهه - التواصل"], "a": 0, "ex": ""}, {"id": "vbank22-6", "track": "verbal", "set": "vbank13", "type": "الخطأ السياقي", "q": "يتناسب المستوى الحضاري للإنسان ولمجتمعه مع قيمة وحجم ما يحتاج من عمل وجهد.", "opts": ["الحضاري", "قيمة", "يحتاج", "جهد"], "a": 2, "ex": "الصواب: يبذل"}, {"id": "vbank32-8", "track": "verbal", "set": "vbank13", "type": "الخطأ السياقي", "q": "حق عليك أن تخفي السعادة حتى وإن كنت لا تشعر بها.", "opts": ["تخفي", "السعادة", "تشعر", "بها"], "a": 0, "ex": "الصواب: إظهار، تظهر"}, {"id": "vbank16-11", "track": "verbal", "set": "vbank13", "type": "استيعاب المقروء", "q": "امتداد طبقة الأوزون عن سطح اليابسة يتراوح من ....... إلى .......", "opts": ["٢٠ كم - ٣٥ كم", "من ١٢ كم - ٣٥ كم", "١٢ كم", "٢٠ كم"], "a": 1, "ex": "", "passage": "الغلاف الجوي\nيُعرف الغلاف الجوي بأنّه الطبقة التي تتكوّن من خليط من الغازات المحيطة بالكواكب أو بالأجسام التي كتلتها عالية مثل النجوم، بحيث تبقى ملاصقة لهذا الجسم من خلال قوّة الجاذبية الأرضيّة، ومن الأهمية الكبيرة للغلاف الجوي أنّه يقوم بتزويد الكائنات الحيّة بالغازات التي يحتاجها في عمليّة التنفّس. يعد الغلاف الجوي غلافًا شفافًا يسمح بمرور الأشعة المرئيّة والحراريّة من خلاله، بالإضافة إلى أنّه يقي الأرض ويحميها من الإشعاعات الضارّة الصادرة من الشمس مثل الأشعة فوق البنفسجية والتي تمتصها طبقة الأوزون، وأيضًا بحماية الأرض من النيازك والشهب التي تصدر من الفضاء الخارجي. ويعتبر غاز الأوزون من نعم الله علينا فهو يحمي الأرض من الأشعة الضارة للشمس ويتواجد على ارتفاع من ٢٠ إلى ٣٥ كم من سطح اليابسة بتركيز عالٍ. ويتكون غاز الأوزون نتيجة تعرض غاز الأكسجين في الغلاف الجوي للأشعة فوق البنفسجية الضارة التي تفككه وتجعله يتحد مع ذرتين أكسجين أخرتين مكونًا ثلاثي الأكسجين المعروف باسم الأوزون في طبقة الستراتوسفير، وتبدأ من ١٢ كم عن سطح الأرض وهي تحتوي على غاز الأوزون."}, {"id": "vbank4-10", "track": "verbal", "set": "vbank13", "type": "استيعاب المقروء", "q": "أنسب عنوان للنص:", "opts": ["سياسة الانفتاح", "أرقام هائلة", "حقائق مغلوطة", "خطر داهم"], "a": 3, "ex": "", "passage": "كشفت «سياسة الانفتاح» أن عدد الروس ينخفض خلال العام الواحد بثلاثة أرباع المليون نسمة.. وهذا الرقم الرهيب سببه تردي مستوى الرعاية الصحية بحيث تراجع متوسط عمر الذكور إلى ٥٩ سنة والإناث إلى ٧٢ سنة، وارتفعت معدلات الوفيات ١٨٪ في حين لم تعد النساء تفكر بالإنجاب بتاتًا (... ويقال إن من أهم أسباب حل الاتحاد السوفيتي السابق أن المسلمين كانوا سيشكلون بمعدل تناسلهم الكبير النسبة الغالبية في الاتحاد قبل نهاية الربع الأول من القرن الحالي)!!\n— نص آخر —\nأكدت عدة وسائل إعلام روسية أن روسيا تواجه مشكلة في انخفاض عدد السكان، حيث إنها تعاني أزمة سكانية حادة تتمثل في الانخفاض الحاد في عدد السكان وانتشار الأمراض الصحية والاجتماعية والنفسية في المجتمع الروسي، فوفقًا لبعض الإحصاءات فإنهم ينقصون بمقدار ٧٥٠ ألف نسمة كل عام، ويرجع ذلك إلى تدني الرعاية الصحية إذ انخفض متوسط أعمار الرجال إلى ٥٩ سنة والنساء إلى ٧١ سنة، كما أن هناك عزوفًا عن الإنجاب لدى الشعب الروسي لأسباب كثيرة تجعل النساء الروسيات يعزفن عن الإنجاب مثل الانتشار الواسع للطلاق (٧٥٪ من حالات الزواج)، وسوء التخطيط العائلي، وانخفاض مستوى المعيشة، وانتشار الفقر، والخوف من المستقبل في ظل الأوضاع الاقتصادية والاجتماعية التي تمر بها روسيا حاليًا، ويمكن أن نلمس خوفهم في صحيفة موسكو التي ما زالت تنشر مقالات بعنوان «روسيا ٢٠٢٥-٢٠٥٠»، ناهيك عن بعض المفاهيم التي غدت تتصدر تلك المقالات من نوعية أن الروس سيصبحون أقلية وهاجس انقراض الروس، وفي ظل هذه الظروف إلا أن عدد مسلمي روسيا والذين يربو عددهم عن ٢٠ مليون نسمة يشهد تزايدًا مستمرًا بسبب إقبالهم على التعدد ورغبتهم في الإنجاب الذي حث عليه الدين الإسلامي، ولو لم يتفكك الاتحاد السوفيتي لأصبح المسلمون أغلبية فيه بحلول القرن المقبل."}, {"id": "vbank39-11", "track": "verbal", "set": "vbank13", "type": "استيعاب المقروء", "q": "العلاقة بين الجملتين، علاقة:", "opts": ["تشابه", "عكسية", "طردية", "تماثل"], "a": 1, "ex": "", "passage": "الكريم يلين عندما يُستعطف، واللئيم يقسو عندما يُستلطف."}, {"id": "vbank16-13", "track": "verbal", "set": "vbank13", "type": "استيعاب المقروء", "q": "من سياق الفقرة (٢) يفهم أن عبارة «التغيير المصاحب للتنمية» تعني:", "opts": ["الموازي لمسارها", "المساوي لها", "الحادث بسببها", "المسرع لحدوثها"], "a": 2, "ex": "", "passage": "التنمية والنمو\n(١) يخلط البعض بين مفهومي التنمية والنمو، باعتبارهما مفهومين مترادفين، رغم ما بينهما من تباين في عدد من الأوجه. فالنمو يتضمن عملية تغيير تلقائية تحدث من غير تدخل من جانب الإنسان، أو أن هذا التدخل يكون محدودًا وفي جانب واحد غالبًا. أما التنمية فتشير إلى عملية تغيير متعمدة محكومة بإرادة إنسانية وبجهود منظمة لتحقيق أهداف تمس حياة الإنسان بأكملها.\n(٢) كما أن مقدار التغير الحادث من طريق النمو عادة ما يكون ضئيلًا وأقرب إلى التغيير الكمي. أما التغيير المصاحب للتنمية فهو تغيير عميق وسريع وأقرب إلى التغيير الكيفي. فالنمو يحدث عن طريق التطور البطيء والتحول التدريجي، أما التنمية فتحتاج إلى دفعة قوية تخرج المجتمع من حالة الركود والتخلف إلى حالة التقدم والازدهار.\n(٣) وأخيرًا فإن النمو مستوعب في التنمية، في حين ليس من الضروري أن يفضي كل نمو إلى تنمية. لذا يمكن القول إن الدول النامية ليست في حاجة إلى مجرد النمو، وإنما هي في حاجة إلى التنمية المبنية على القدرة والخصائص الذاتية لكل دولة. ويظهر الفرق بين مفهوم التنمية ومفهوم التقدم من حقيقة أن عملية التنمية ومستواها يمكن التحقق منها عمليًا وموضوعيًا، أما التقدم فهو حكم قيمي وتفسير ذاتي ونسبي؛ يختلف باختلاف الإطار الفلسفي والفكري لكل مجتمع."}, {"id": "vbank33-9", "track": "verbal", "set": "vbank13", "type": "استيعاب المقروء", "q": "تخبرنا الفقرة (٢) أن التاريخ القمري بدأ في:", "opts": ["بداية القرن الرابع الميلادي", "نهاية القرن الرابع الميلادي", "بداية القرن الخامس الميلادي", "نهاية القرن الخامس الميلادي"], "a": 2, "ex": "", "passage": "التقاويم\n(١) عرف الإنسان بأن هناك علاقة ما بين الأرض والسماء، وتتأثر الأرض بتغيرات ما تحصل في السماء، ولاحظ الإنسان أن عندما تشرق الشمس تستيقظ الحياة في الأرض وتغني الطيور بشروقها وتهدي الحرارة للأرض، ومن هنا اتخذ الإنسان اليوم كأبسط وحدة زمنية بشروق وغروب الشمس، واستمر التأمل البشري في السماء ليخترع وحدات زمنية أخرى، ولاحظ بأن الاختلاف في مواقع النجوم تخبره عن المواسم البرد والحر والعواصف وغيرها، من هنا عرفت السنة والتقاويم، والتقويم خاص بالشعوب لكل أمة على وجه الأرض تقويمها الخاص الذي تعتز به والذي يعتبر جزءًا أصيلًا من هويتها وثقافتها وشخصيتها ودينها أيضًا، فالمعتقدات الدينية للأمم الموجودة اليوم على سطح الأرض أسهمت بشكل كبير في نشأة التقاويم المعمول بها من قبل هذه الأمم، حيث ترمز بداية التقاويم إلى أحداث دينية عظيمة أثرت ولا تزال تؤثر في حياة الشعوب. والأمة المسلمة كباقي الأمم، لها تقويمها الخاص الذي يعود بها إلى ذكرى مهمّة، قلبت وجه الأرض، والإنسانية إلى آخر الدهر، والقصة أن التقويم الهجري الإسلامي يرمز إلى الهجرة النبوية الشريفة من مكة المكرمة إلى المدينة المنورة؛ حيث أسّس رسول الله ﷺ ومن كان معه من المسلمين الصابرين نواة الدولة الإسلامية التي ما لبثت أن صارت قوّةً عالميّةً عظمى تقف ندًا لند، بل وتتفوق على أقوى قوتين عالميتين في ذلك الوقت وهما: الفرس، والروم. التفت الخليفة عمر بن الخطاب رضي الله عنه إلى مكانة الهجرة النبوية، ودورها العظيم في إعادة صياغة مجرى التاريخ، مما دفعه إلى اتخاذ هذه المناسبة بدايةً للتقويم الهجري الذي لا يزال مستعملًا بين أبناء الأمة الإسلامية إلى يومنا هذا.\n(٢) والفرق بين السنة الهجرية والميلادية ١١ يومًا، والتقويم الميلادي أقدم من التقويم الهجري، فالتقويم الهجري ظهر بعده بأربعمائة واثني عشر عامًا، حيث في سنة ٤١٢ ميلادية وقبل البعثة النبوية بـ ١٥٠ سنة وبمكة المكرمة اجتمع العرب سواء من رؤساء القبائل أو الوفود في حج ذلك العام أيام كلاب بن مرة الجد الخامس للرسول، لتحديد أسماء جديدة للأشهر يتفق عليها كل العرب وأهل الجزيرة العربية بعد أن كانت القبائل تسمي الأشهر بأسماء مختلفة فتوحدوا على الأسماء الحالية.\nمن ذاكرة المختبر: (المصريين كان عندهم تقويم تبع الشمس والنيل.. والروم لديهم تقويم (الروماني)، والتقويم الميلادي، واليوناني، والهجري وكانوا يعتمدوا شهورًا غير محرم وصفر فكان هذا التقويم بالأحداث (مثلًا حدث هذا الشيء بعد عام الفيل بكم عام وهكذا). ثم التقويم الذي وضعه سيدنا عمر بن الخطاب رضي الله عنه.)"}, {"id": "vbank30-1", "track": "verbal", "set": "vbank14", "type": "تناظر لفظي", "q": "قلق : توتر", "opts": ["مطر : غرق", "كتابة : تدوين", "وضوء : نظافة", "تثبيت : وقوف"], "a": 1, "ex": "العلاقة: ترادف"}, {"id": "vbank18-2", "track": "verbal", "set": "vbank14", "type": "تناظر لفظي", "q": "متر : ياردة", "opts": ["لتر : عقدة", "دونم : جالون", "هكتار : فدان", "ميل : طن"], "a": 2, "ex": "العلاقة: فئة، وحدة قياس"}, {"id": "vbank21-3", "track": "verbal", "set": "vbank14", "type": "تناظر لفظي", "q": "وجود : عدم", "opts": ["سمين : نحيف", "رفيع : رقيق", "طويل : عريض", "كثير : كبير"], "a": 0, "ex": "العلاقة: تضاد"}, {"id": "vbank4-3", "track": "verbal", "set": "vbank14", "type": "تناظر لفظي", "q منظمة اليونسكو، فضلًا عن أن معاهدة الفضاء الخارجي لعام ١٩٦٧ لا تعترف لأي دولة بحق ادعاء السيادة على القمر، ناهيك عن ترشيحه للتسجيل على قائمة التراث العالمي.\nوتهدف المقترحات إلى الاستفادة من الدروس المستخلصة من التجارب السابقة لبرنامج الفضاء الأمريكي؛ ومن ذلك: ضرورة الهبوط على مسافة لا تقل عن كيلومترين عن حدود الموقع تجنبًا لإغراقه بالغبار، أو أي آثار أخرى؛ إذ اقتُلع علم بعثة (أبولو) بفعل قوة الغازات المنبعثة من محرك المركبة، في حين مازالت بقية أعلام البعثات منتصبة."}, {"id": "vbank30-10", "track": "verbal", "set": "vbank14", "type": "استيعاب المقروء", "q": "كم عدد التقاويم المذكورة في النص؟", "opts": ["٣", "٤", "٥", "٦"], "a": 3, "ex": "", "passage": "التقاويم\n(١) عرف الإنسان بأن هناك علاقة ما بين الأرض والسماء، وتتأثر الأرض بتغيرات ما تحصل في السماء، ولاحظ الإنسان أن عندما تشرق الشمس تستيقظ الحياة في الأرض وتغني الطيور بشروقها وتهدي الحرارة للأرض، ومن هنا اتخذ الإنسان اليوم كأبسط وحدة زمنية بشروق وغروب الشمس، واستمر التأمل البشري في السماء ليخترع وحدات زمنية أخرى، ولاحظ بأن الاختلاف في مواقع النجوم تخبره عن المواسم البرد والحر والعواصف وغيرها، من هنا عرفت السنة والتقاويم، والتقويم خاص بالشعوب لكل أمة على وجه الأرض تقويمها الخاص الذي تعتز به والذي يعتبر جزءًا أصيلًا من هويتها وثقافتها وشخصيتها ودينها أيضًا، فالمعتقدات الدينية للأمم الموجودة اليوم على سطح الأرض أسهمت بشكل كبير في نشأة التقاويم المعمول بها من قبل هذه الأمم، حيث ترمز بداية التقاويم إلى أحداث دينية عظيمة أثرت ولا تزال تؤثر في حياة الشعوب. والأمة المسلمة كباقي الأمم، لها تقويمها الخاص الذي يعود بها إلى ذكرى مهمّة، قلبت وجه الأرض، والإنسانية إلى آخر الدهر، والقصة أن التقويم الهجري الإسلامي يرمز إلى الهجرة النبوية الشريفة من مكة المكرمة إلى المدينة المنورة؛ حيث أسّس رسول الله ﷺ ومن كان معه من المسلمين الصابرين نواة الدولة الإسلامية التي ما لبثت أن صارت قوّةً عالميّةً عظمى تقف ندًا لند، بل وتتفوق على أقوى قوتين عالميتين في ذلك الوقت وهما: الفرس، والروم. التفت الخليفة عمر بن الخطاب رضي الله عنه إلى مكانة الهجرة النبوية، ودورها العظيم في إعادة صياغة مجرى التاريخ، مما دفعه إلى اتخاذ هذه المناسبة بدايةً للتقو ء", "q": "معنى كلمة (عصب) الواردة بالفقرة (٢):", "opts": ["محور", "غالب", "عصابة", "منشأ"], "a": 0, "ex": "", "passage": "(١) تقع جمهوريّة كينيا في القسم الشرقي من القارة الأفريقيّة، وحدودها مرتبطة مع الكثير من الدول الأفريقيّة، فنجد بأنّ المحيط الهندي هو الذي يحدّها من الجهة الشرقيّة، وأوغندا من الجهة الغربيّة، وتنزانيا من الجهة الجنوبيّة، وأثيوبيا والسّودان من الجهة الشماليّة، أمّا من الجهة الشماليّة الشرقيّة فنجد دولة الصومال.\n(٢) وتنقسم الأراضي إلى قسمين ساحلية ومرتفعة، يعيش سكانها ضمن ٨٪ من مساحتها فقط والباقي هي واحات ومساحات شاسعة تعيش فيها الحيوانات النادرة، فالمنطقة الساحلية عبارة عن شريط ضيق لكن تربته خصبة في معظم أجزاء هذه المنطقة خاصة في الجنوب، ويعيش نحو ٧٥٪ من سكان كينيا في الأراضي المرتفعة، وتقع فيها نيروبي أكبر مدينة في كينيا، ويعمل أغلب سكانها في الزراعة، وهي تعد عصب الاقتصاد الكيني، ويتكلم أكثر السكان اللغة الساحلية إلا أن المتعلمين منهم يتحدثون الإنجليزية وهي تعتبر اللغة المعتمدة في البلاد."}, {"id": "vbank42-11", "track": "verbal", "set": "vbank15", "type": "استيعاب المقروء", "q": "من النص، ما هي الحضارة؟", "opts": ["مزيج عمراني", "مادية", "نتاج عدة من الأصعدة", "منظور فكري"], "a": 2, "ex": "", "passage": "الحضارة\nإن الحضارة هي التحصيل الضخم على المستوى الثقافي والعمراني لشعب من الشعوب إلى جانب الرصيد الروحي والفكري وجانب المادية الحياتية."}, {"id": "vbank12-12", "track": "verbal", "set": "vbank15", "type": "استيعاب المقروء", "q": "علاقة (فالحاجة إليه كبيرة) بما قبلها:", "opts": ["علة", "نتيجة", "تفسير", "تخصيص"], "a": 0, "ex": "", "passage": "الورق\nتغطي الأشجار ثلث سطح الأرض تقريبًا، ويستخدم الكثير منها في صناعة الورق، فالحاجة إليه كبيرة، ويمر ذلك بمراحل متعددة ومتكررة، ويستخدم مثلي هذا الاستخدام في غيره."}, {"id": "vbank4-9", "track": "verbal", "set": "vbank15", "type": "استيعاب المقروء", "q": "نسبة الأطفال الفقراء:", "opts": ["زادت ثلاثة أضعاف", "زادت ستة أضعاف", "قلت ثلاثة أضعاف", "قلت ستة أضعاف"], "a": 0, "ex": "", "passage": "في بريطانيا كانت نسبة الأطفال الفقراء عام ١٩٦٤ واحدًا من كل تسعة، ثم أصبحت واحدًا لكل ثلاثة عام ١٩٩٦."}, {"id": "vbank1-11", "track": "verbal", "set": "vbank15", "type": "استيعاب المقروء", "q": "تعد جملة «سيشعر المصاب بالسكري ...» في النص:", "opts": ["سببًا لما قبلها", "نتيجة لما قبلها", "تأكيدًا لما بعدها", "تمهيدًا لما بعدها"], "a": 1, "ex": "", "passage": "مرض السكري\nيعد مرض السكري من الأمراض المنتشرة في هذا العصر، ومتى أهمل المريض علاجه والسيطرة عليه فقد يؤدي إلى مضاعفات خطيرة، بل ربما إلى الوفاة المبكرة، ويعد العامل الوراثي أحد أسباب هذا المرض، وقد يكون لأسباب أخرى. ولهذا المرض أعراض كثيرة منها الشعور بالعطش بشكل كبير بسبب زيادة معدل الجلوكوز في الجسم والذي يعمل على خروج المياه من أنسجة الجسم ويشعرك بجفاف الفم والحلق، مما يؤدي إلى تناول كميات كبيرة من الماء والسوائل؛ وبالتالي سيشعر المصاب بالسكري بالحاجة الدائمة إلى التبول. ومن الأعراض أيضًا الشعور بالتعب والدوار بشكل مستمر، فتصبح الرؤية لدى المريض ضبابية وغير واضحة ومشوشة، وكذلك الشعور بالصداع والإحساس بالقلق والتوتر؛ مما يؤدي إلى سرعة الغضب لأبسط الأمور. ومن أبرز تلك الأعراض البطء في اندمال الجروح والإصابات."}, {"id": "vbank32-4", "track": "verbal", "set": "vbank16", "type": "تناظر لفظي", "q": "ربيع : سنة", "opts": ["شتاء : صيف", "شمال : جهات"], "a": 1, "ex": "العلاقة: جزء من"}, {"id": "vbank36-1", "track": "verbal", "set": "vbank16", "type": "تناظر لفظي", "q": "سراج المؤمنين : الهدى", "opts": ["سراج البيت : الدابة المطيعة", "سراج النهار : الشمس المضيئة", "السراج الكاسف : شاحب الوجه", "السراج الوهاج : النجم الصغير"], "a": 1, "ex": "العلاقة: مكوّن من"}, {"id": "vbank26-3", "track": "verbal", "set": "vbank16", "type": "تناظر لفظي", "q": "شجرة : نبات", "opts": ["كهرباء : طاقة", "شيب : بياض", "سقوط : تأرجح"], "a": 0, "ex": "العلاقة: تنتج، تكون"}, {"id": "vbank46-4", "track": "verbal", "set": "vbank16", "type": "تناظر لفظي", "q": "تعب : نوم", "opts": ["الراحة : الصلاة", "المعرفة : السفر", "الزكاة : البخل", "الجهل : العلم"], "a": 3, "ex": "العلاقة: يتم معالجته عن طريق"}, {"id": "vbank4-5", "track": "verbal", "set": "vbank16", "type": "إكمال الجمل", "q": "العلوم أربعة: الفقه للأديان والطب للأبدان ودراسة ....... لمعرفة الأزمان فسها، فعندما رفع إبراهيم وإسماعيل عليهما السلام قواعد الكعبة المشرفة عاد إبراهيم عليه السلام إلى فلسطين.\nلكن خبر أول من كسا الكعبة على خلاف بين المؤرخين، فذكرت فيه أقوال عدة منها أن (عدنان بن أد) الجد الأعلى للرسول هو واحد ممن كسوها.\nوظلت كسوة الكعبة تحظى باهتمام الخلفاء المسلمين عبر العصور، ثم عنيت مصر بشرف كسوة الكعبة فظلت كسوة الكعبة المشرفة ترسل للسعودية من مصر عبر القرون، إلى أن توقف إرسالها نهائيًا من مصر عام ١٩٦٢م، ثم تولت المملكة العربية السعودية شرف صناعتها، فقد أنشأت مصنعًا مخصصًا لعمل كسوة الكعبة تم افتتاحه عام ١٩٧٧ بأم الجود بمكة المكرمة."}, {"id": "vbank13-12", "track": "verbal", "set": "vbank18", "type": "استيعاب المقروء", "q": "نفهم من النص أن:", "opts": ["الإحسان من آثار الرحمة", "الرحمة من آثار الإحسان", "الإحسان سبب للرحمة", "الرحمة نتيجة للإحسان"], "a": 0, "ex": "", "passage": "الرحمة والإحسان\nالرحمة رقة تقتضي الإحسان إلى المرحوم، وقد تستعمل تارة في الرقة المجردة وتارة في الإحسان المجرد عن الرقة."}, {"id": "vbank22-10", "track": "verbal", "set": "vbank18", "type": "استيعاب المقروء", "q": "علاقة (فاحذر ........) بما قبلها:", "opts": ["تتميمها", "تعللها", "تفصلها", "استدراك"], "a": 0, "ex": "", "passage": "عدم استعداء الآخرين\nإذا اختبرت إنسانًا ولم يكن صديقًا لك؛ فاحذر أن تجعله عدوًا لك."}, {"id": "vbank28-9", "track": "verbal", "set": "vbank18", "type": "استيعاب المقروء", "q": "نستنتج من الفقرة (١) أن عدد القتلى في زلزال تشيلي بلغ:", "opts": ["٣١٩٩", "٢٠٠٠", "٢١٩٩", "٣٠٠٠"], "a": 2, "ex": "", "passage": "الزلازل\n(١) منذ بدء تسجيل الزلازل علميًا فإن أعتى الزلازل كانت على النحو التالي بمقياس ريختر: زلزال تشيلي عام (١٩٦٠) فقد سجل ٩,٥، وقتل ألفي شخص، وشرد ثلاثة آلاف آخرين، كما انتقلت هزاته إلى جزر هاواي، وقتلت ٦١ شخصًا، وإلى اليابان حيث قضت على ١٣٨ شخصًا، وزلزال ألاسكا عام ١٩٦٤ الذي وصلت قوته إلى ٩,٢ درجات، ويعد أعنف زلزال شهده النصف الشمالي من الأرض، وتسبب بوفاة ١٢٥ شخصًا.\n(٢) وزلزال جزر أندريانوف عام ١٩٥٧م في ألاسكا أيضًا وبلغت قوته ٩,١ درجات، وقد دمر جزيرة أدك بصورة كاملة، كما تسبب في تدمير حوض السفن في جزيرة إنماك المجاورة، وخطوط النفط الضخمة ى التفكير، ولديه الجرأة على العمل، ولديه الجرأة على توقع النجاح.", "opts": ["خصال", "التفكير", "العمل", "النجاح"], "a": 3, "ex": "الصواب: الفشل"}, {"id": "vbank48-13", "track": "verbal", "set": "vbank19", "type": "استيعاب المقروء", "q": "الضمير في (له) في الفقرة الثانية يعود على:", "opts": ["الكتاب", "الوطواط"], "a": 1, "ex": "", "passage": "الوطواط\n١. جمال الدين محمد بن إبراهيم بن يحيى الأنصاري الكتبي، الملقب بالوطواط، وُلد بالقاهرة وعاش فيها حتى وفاته. عُرف في زمنه بأنه أديب مترسل وكاتب بارع، اشتُهر بحسن التعبير وإتقان الصياغة، فكان ضابطًا لمعانيه، متفننًا في عرض أفكاره، حتى عُدَّ من أبرز أدباء مصر في القرن السادس الهجري.\n٢. لم يقتصر الوطواط على مجال الأدب، بل كان فيلسوفًا واسع الاطلاع، كتب في موضوعات متعددة كالكيمياء والنبات والحيوان والفلك، وجمع بين الفكر والعلم والأدب ومن أشهر مؤلفاته كتاب غرر الخصائص الواضحة وعرر النقائص الفاضحة. وقد لقيت هذه المؤلفات تقدير العلماء، حتى إن الصفدي ترجم له في كتبه، وذكر فضله ومكانته بين مفكري عصره.\n٣. بنى الوطواط كتابه غرر الخصائص الواضحة على ستة عشر قسمًا، ثمانية منها تناول فيها الفضائل والشمائل، وثمانية أخرى عرض فيها النقائص والرذائل، فرتّب مادته ورتّب فصوله بعناية. وقد جمع في أسلوبه بين الحماقة والفصاحة، فكان نموذجًا للمفكر الذي يمزج الجد بالهزل، ويعرض المعاني الدقيقة في ثوب سهل ممتنع.\n— نص آخر —\nمحمد بن إبراهيم بن يحيى الأنصاري، المشهور بالوطواط، أديب بغدادي من أعلام القرن السابع الهجري، تميز ببلاغته واهتمامه بالعلوم والأدب عرف عنه اتساع الثقافة وحسن التعبير، وله مؤلفان بارزان هما: غرر الخصائص الواضحة ومباهج الفكر ومناهج العبر. وقد ترجم له الصفدي في كتبه، وامتدحه، معدًّا إياه من الأدباء المجيدين وأهل الفضل."}, {"id": "vbank46-13", "track": "verbal", "set": "vbank19", "type": "استيعاب المقروء", "q": "يفهم من العبارة أن المقصود بالحرارة المتولدة هي:", "opts": ["التي تصل إلى الأرض", "المندفعة بصوت قوي", "المتكاثرة بسرعة", "المتجددة والمنبعثة"], "a": 3, "ex": "", "passage": "البرق\nتعد الحرارة المتولدة أثناء وميض البرق أكثر سخونة من سطح الشمس."}, {"id": "vbank21-10", "track": "verbal", "set": "vbank19", "type": "استيعاب الم
